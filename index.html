<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 214, 107, .55) rgba(8, 11, 22, .5);
    }

    body {
      min-height: 300vh;
      margin: 0;
      overflow-x: hidden;

      /* خلفية الموقع الأصلية */
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center 0;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: "Aref Ruqaa", serif;
    }

    .scroll-space {
      min-height: 300vh;
      width: 100%;
    }

    .artwork {
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;

      /* صورة أصغر، ثابتة بمنتصف الشاشة ومائلة قليلًا للأسفل */
      transform: translate(-50%, -50%) rotate(5deg);

      pointer-events: none;
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0 0 3px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        scale .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      scale: 1.08;
    }

    .letter-button[aria-pressed="true"] {
      border-color: var(--gold-bright);
      background: radial-gradient(
        circle,
        #fff1b8 0%,
        #ffd66b 52%,
        #d18a18 100%
      );
      color: #241600;
      box-shadow:
        0 0 12px 4px rgba(255, 211, 94, .85),
        0 0 34px 12px rgba(255, 194, 54, .62),
        inset 0 0 14px rgba(255, 255, 225, .9);
      animation: golden-glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 10px 3px rgba(255, 211, 94, .72),
          0 0 25px 8px rgba(255, 194, 54, .42),
          inset 0 0 12px rgba(255, 255, 225, .7);
      }

      to {
        box-shadow:
          0 0 17px 6px rgba(255, 231, 153, .96),
          0 0 40px 16px rgba(255, 194, 54, .68),
          inset 0 0 18px rgba(255, 255, 225, .95);
      }
    }

    /* مواقع الدوائر عند نهايات الأسهم في الصورة */
    .letter-ra {
      left: 82%;
      top: 87%;
    }

    .letter-ta {
      left: 85%;
      top: 16%;
    }

    .letter-alif {
      left: 47%;
      top: 14%;
    }

    .letter-jeem {
      left: 13%;
      top: 88%;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }

      .artwork {
        width: min(82vw, 64vh, 420px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scroll-space" aria-label="مساحة للتصفح صعوداً ونزولاً">
    <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
      <img
        class="artwork-image"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
        alt="رسم عربي مزخرف"
        draggable="false"
      >

      <button
        class="letter-button letter-ra"
        type="button"
        aria-label="حرف الراء"
        aria-pressed="false"
        title="راء"
      >ر</button>

      <button
        class="letter-button letter-ta"
        type="button"
        aria-label="حرف التاء"
        aria-pressed="false"
        title="تاء"
      >ت</button>

      <button
        class="letter-button letter-alif"
        type="button"
        aria-label="حرف الألف"
        aria-pressed="false"
        title="ألف"
      >ا</button>

      <button
        class="letter-button letter-jeem"
        type="button"
        aria-label="حرف الجيم"
        aria-pressed="false"
        title="جيم"
      >ج</button>
    </div>
  </main>

  <script>
    // تحريك خلفية الموقع عند التمرير، مع بقاء صورة PNG الأمامية ثابتة.
    let framePending = false;

    function updateParallax() {
      const offset = -(window.scrollY * 0.22);
      document.body.style.backgroundPosition = `center ${offset}px`;
      framePending = false;
    }

    window.addEventListener("scroll", () => {
      if (!framePending) {
        window.requestAnimationFrame(updateParallax);
        framePending = true;
      }
    }, { passive: true });

    updateParallax();

    // النقر يبدّل الدائرة بين الأبيض المتوهج بالأزرق والذهبي المتوهج.
    document.querySelectorAll(".letter-button").forEach((button) => {
      button.addEventListener("click", () => {
        const isActive = button.getAttribute("aria-pressed") === "true";
        button.setAttribute("aria-pressed", String(!isActive));
      });
    });
  </script>
</body>
</html>
