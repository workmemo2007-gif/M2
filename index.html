<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة و Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --gold-dark-bg: rgba(30, 22, 10, 0.92);
      --off-white-translucent: rgba(250, 248, 242, 0.18);
      --off-white-glow: rgba(255, 253, 245, 0.95);
      --gold-border: rgba(255, 214, 107, 0.85);
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      will-change: background-position;
    }

    /* غشاء أسود شفاف لإبراز الكتابات والنصوص */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    .section-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      position: relative;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;
      transform: rotate(5deg);
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    /* تصميم عرض الصورة الثانية */
    .second-artwork-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px 10px 10px;
      box-sizing: border-box;
    }

    .second-artwork {
      width: min(95vw, 90vh, 1000px);
      max-width: 100%;
      height: auto;
      border: none;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
      opacity: 0;
      transform: translateY(120px) scale(0.92);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    .second-artwork.slide-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* === تصميم الشاشة الحديثة المعطلة 3D === */
    .modern-screen-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 15px 120px 15px;
      perspective: 1200px;
    }

    .modern-monitor-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(92vw, 680px);
    }

    .modern-monitor-3d {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-style: preserve-3d;
      transform: rotateX(5deg);
      transition: transform 0.5s ease;
    }

    .modern-monitor-3d:hover {
      transform: rotateX(0deg) scale(1.01);
    }

    /* إطار الشاشة يتكيف مع حجم الصورة تلقائياً */
    .modern-screen-frame {
      width: 100%;
      background: #0d121f;
      border: 8px solid #1a2235;
      border-bottom: none;
      border-radius: 16px 16px 0 0;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.95),
        0 0 30px rgba(37, 99, 235, 0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modern-screen-inner {
      position: relative;
      width: 100%;
      background: #04060a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* الصورة داخل الشاشة تناسب الأبعاد الأصلية */
    .modern-screen-img {
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      filter: blur(20px) contrast(180%) brightness(40%) hue-rotate(170deg);
      transition: filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    /* تأثيرات العطل والكسور على الشاشة الحديثة */
    .modern-glitch-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.08));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0.95;
      transition: opacity 0.8s ease;
    }

    .glass-crack-effect {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 65% 35%, transparent 0%, rgba(255,255,255,0.2) 2%, transparent 5%),
        linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.45) 42%, transparent 44%),
        linear-gradient(25deg, transparent 58%, rgba(255,255,255,0.35) 60%, transparent 62%);
      pointer-events: none;
      z-index: 3;
      opacity: 0.85;
      transition: opacity 0.8s ease;
    }

    .modern-status-text {
      position: absolute;
      z-index: 10;
      background: rgba(10, 14, 26, 0.92);
      border: 1px solid #3b82f6;
      color: #93c5fd;
      padding: 12px 22px;
      border-radius: 8px;
      font-family: 'Montserrat', 'Aref Ruqaa', sans-serif;
      font-size: clamp(12px, 1.9vw, 15px);
      text-align: center;
      line-height: 1.6;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
      animation: modern-pulse 1.6s infinite alternate;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    @keyframes modern-pulse {
      0% { opacity: 0.75; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    /* عند تشغيل وإصلاح الشاشة */
    .modern-monitor-3d.active .modern-screen-img {
      filter: blur(0px) contrast(100%) brightness(100%) hue-rotate(0deg);
    }

    .modern-monitor-3d.active .modern-glitch-overlay,
    .modern-monitor-3d.active .glass-crack-effect,
    .modern-monitor-3d.active .modern-status-text {
      opacity: 0;
    }

    /* لوحة أزرار الشاشة المدمجة بالأسفل مباشرة بدون كتابة */
    .modern-control-panel {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      padding: 10px 18px;
      background: #141a29;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 6px solid #1a2235;
      border-radius: 0 0 16px 16px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
      direction: ltr;
    }

    .panel-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      background: linear-gradient(145deg, #1e2738, #111624);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      user-select: none;
    }

    .panel-btn .btn-icon {
      width: 20px;
      height: 20px;
    }

    .panel-btn:hover {
      background: linear-gradient(145deg, #2a3752, #182238);
      border-color: var(--gold);
      color: var(--gold-bright);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 214, 107, 0.3);
    }

    .panel-btn:active {
      transform: translateY(1px);
    }

    .panel-btn.active {
      background: linear-gradient(145deg, #b45309, #d97706);
      border-color: var(--gold-bright);
      color: #fff;
      box-shadow: 0 0 16px rgba(217, 119, 6, 0.7);
    }

    .power-btn.active {
      background: linear-gradient(145deg, #1d4ed8, #3b82f6);
      border-color: #60a5fa;
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.8);
    }

    .power-led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      margin-left: 6px;
      transition: all 0.4s ease;
    }

    .power-led.active {
      background-color: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    /* قاعدة وحامل الشاشة 3D Stand */
    .modern-stand {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      z-index: -1;
    }

    .stand-neck {
      width: 70px;
      height: 38px;
      background: linear-gradient(180deg, #1e2638, #0b0e17);
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
      clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
    }

    .stand-base {
      width: 220px;
      height: 12px;
      background: linear-gradient(90deg, #0f1420, #2a3650, #0f1420);
      border-radius: 6px 6px 2px 2px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }

    /* أزرار الحروف التفاعلية */
    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        transform .4s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .letter-button[aria-pressed="true"] {
      border: 2px solid var(--gold-bright);
      background: rgba(252, 249, 240, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-bright);
      box-shadow:
        0 0 20px 6px rgba(255, 214, 107, 0.45),
        0 0 40px 14px rgba(255, 194, 54, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.25);
      animation: golden-glow 1.8s ease-in-out infinite alternate;
    }

    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(210px, 48vw, 260px);
      height: auto;
      min-height: 100px;
      padding: 10px 14px 14px 14px;
      border-radius: 16px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--off-white-glow);
      font-size: clamp(13px, 1.9vw, 16px);
      line-height: 1.6;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 214, 107, 0.7);
      font-weight: 700;
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 18px;
      margin-top: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 214, 107, 0.35);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1px;
      height: 100%;
      background-color: var(--gold-bright);
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 6px rgba(255, 214, 107, 0.7);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold-bright);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 14px 4px rgba(255, 211, 94, .5),
          0 0 28px 8px rgba(255, 194, 54, .3),
          inset 0 0 14px rgba(255, 255, 255, .2);
      }
      to {
        box-shadow:
          0 0 22px 8px rgba(255, 231, 153, .8),
          0 0 45px 18px rgba(255, 194, 54, .5),
          inset 0 0 22px rgba(255, 255, 255, .35);
      }
    }

    .letter-ra { left: 82%; top: 87%; }
    .letter-ta { left: 85%; top: 16%; }
    .letter-ta[aria-pressed="true"] {
      transform: translate(-100%, -100%);
      transform-origin: bottom right;
    }
    .letter-alif { left: 47%; top: 14%; }
    .letter-jeem { left: 13%; top: 88%; }
    .letter-jeem[aria-pressed="true"] {
      transform: translate(0, 0);
      transform-origin: top left;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }
      .artwork {
        width: min(82vw, 64vh, 420px);
      }
      .second-artwork {
        width: 100vw;
      }
      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 200px;
        min-height: 85px;
        padding: 8px 10px 10px 10px;
      }
      .modern-control-panel {
        gap: 8px;
        padding: 8px 12px;
      }
      .panel-btn {
        width: 32px;
        height: 32px;
      }
      .panel-btn .btn-icon {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>

<body>
  <main aria-label="مساحة عرض الصورة الحرفية">
    
    <!-- القسم الأول: اللوحة التفاعلية والأزرار -->
    <div class="section-container">
      <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
        <img
          class="artwork-image"
          src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
          alt="رسم عربي مزخرف"
          draggable="false"
        >

        <!-- حرف الراء -->
        <button
          class="letter-button letter-ra letter-expandable"
          type="button"
          aria-label="حرف الراء"
          aria-pressed="false"
          title="راء"
          data-letter="ra"
        >
          <span class="letter-text">ر</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ra"></p><span class="cursor" id="cursor-ra" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف التاء -->
        <button
          class="letter-button letter-ta letter-expandable"
          type="button"
          aria-label="حرف التاء"
          aria-pressed="false"
          title="تاء"
          data-letter="ta"
        >
          <span class="letter-text">ت</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ta"></p><span class="cursor" id="cursor-ta" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الألف -->
        <button
          class="letter-button letter-alif letter-expandable"
          type="button"
          aria-label="حرف الألف"
          aria-pressed="false"
          title="ألف"
          data-letter="alif"
        >
          <span class="letter-text">ا</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-alif"></p><span class="cursor" id="cursor-alif" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الجيم -->
        <button
          class="letter-button letter-jeem letter-expandable"
          type="button"
          aria-label="حرف الجيم"
          aria-pressed="false"
          title="جيم"
          data-letter="jeem"
        >
          <span class="letter-text">ج</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- القسم الثاني: الصورة العائمة -->
    <div class="second-artwork-container">
      <img
        id="second-img"
        class="second-artwork"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/adadf85a0ca189e75ecac30f00924564fbb59352/IMG_2577.png"
        alt="صورة عائمة جديدة"
        draggable="false"
      >
    </div>

    <!-- القسم الثالث: شاشة معطلة حديثة 3D بالأسفل -->
    <div class="modern-screen-container">
      <div class="modern-monitor-wrapper">
        <!-- مجسم الشاشة الحديثة 3D -->
        <div class="modern-monitor-3d" id="modern-monitor">
          <div class="modern-screen-frame">
            <div class="modern-screen-inner">
              <!-- الصورة المعروضة داخل الشاشة الحديثة -->
              <img class="modern-screen-img" src="https://raw.githubusercontent.com/workmemo2007-gif/M2/cf0d61006943027ac1c821b662336a6501d8641d/IMG_2592.jpeg" alt="الصورة المعروضة" draggable="false">
              <!-- تأثير التشويش والكسور الحديثة -->
              <div class="modern-glitch-overlay"></div>
              <div class="glass-crack-effect"></div>
              <!-- رسالة تنبيه العطل -->
              <span class="modern-status-text">SYSTEM ERROR: DISPLAY DAMAGED ⚡<br>اضغط زر التشغيل لإصلاح الشاشة</span>
            </div>

            <!-- لوحة أزرار الشاشة المدمجة بالأسفل مباشرة بدون كتابة -->
            <div class="modern-control-panel">
              <button type="button" class="panel-btn power-btn" id="btn-modern-power" title="تشغيل / كشف الصورة">
                <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M13,3H11V13H13V3M17.83,5.17L16.41,6.59C18.05,7.91 19,9.9 19,12A7,7 0 0,1 12,19A7,7 0 0,1 5,12C5,9.9 5.95,7.91 7.58,6.58L6.17,5.17C4.21,6.88 3,9.3 3,12A9,9 0 0,0 12,21A9,9 0 0,0 21,12C21,9.3 19.79,6.88 17.83,5.17Z"/></svg>
              </button>

              <button type="button" class="panel-btn music-btn" id="btn-modern-music" title="موسيقى رومانسية">
                <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M12,3V13.55C11.41,13.21 10.73,13 10,13A5,5 0 0,0 5,18A5,5 0 0,0 10,23A5,5 0 0,0 15,18V6H19V3H12Z"/></svg>
              </button>

              <button type="button" class="panel-btn extra-btn" id="btn-modern-source" title="المصدر">
                <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M21,3H3C1.89,3 1,3.89 1,5V17A2,2 0 0,0 3,19H8V21H16V19H21A2,2 0 0,0 23,17V5C23,3.89 22.1,3 21,3M21,17H3V5H21V17Z"/></svg>
              </button>

              <button type="button" class="panel-btn extra-btn" id="btn-modern-menu" title="القائمة">
                <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/></svg>
              </button>

              <button type="button" class="panel-btn extra-btn" id="btn-modern-vol-up" title="رفع الصوت">
                <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M3,9H7L12,4V20L7,15H3V9M14,11H17V8H19V11H22V13H19V16H17V13H14V11Z"/></svg>
              </button>

              <button type="button" class="panel-btn extra-btn" id="btn-modern-vol-down" title="خفض الصوت">
                <svg viewBox="0 0 24 24" class="btn-icon"><path fill="currentColor" d="M3,9H7L12,4V20L7,15H3V9M14,11H22V13H14V11Z"/></svg>
              </button>

              <div class="power-led" id="modern-led" title="مؤشر الحالة"></div>
            </div>
          </div>

          <!-- حامل الشاشة الحديثة 3D -->
          <div class="modern-stand">
            <div class="stand-neck"></div>
            <div class="stand-base"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- الأصوات -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-alif" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/72ad2bf2d4691e866f88413a9f1bd6a809c2c125/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%A7%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <!-- صوت الموسيقى الرومانسية للشاشة الحديثة -->
  <audio id="audio-romantic" loop preload="metadata">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112188.mp3" type="audio/mpeg">
  </audio>

  <script>
    function updateBackgroundOnScroll() {
      const scrollY = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      
      if (maxScroll > 0) {
        const scrollPercent = (scrollY / maxScroll) * 100;
        document.body.style.backgroundPositionY = `${scrollPercent}%`;
      }
    }

    window.addEventListener("scroll", updateBackgroundOnScroll);
    window.addEventListener("resize", updateBackgroundOnScroll);

    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 130) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    const audioRomantic = document.getElementById("audio-romantic");
    const btnModernMusic = document.getElementById("btn-modern-music");

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      if (audioRomantic) {
        audioRomantic.pause();
        if (btnModernMusic) btnModernMusic.classList.remove("active");
      }

      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 130);
          }
        }
      });
    });

    const secondImg = document.getElementById("second-img");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          secondImg.classList.add("slide-in");
        }
      });
    }, { threshold: 0.15 });

    observer.observe(secondImg);

    // === التفاعل مع الشاشة الحديثة 3D وأزرارها ===
    const modernMonitor = document.getElementById("modern-monitor");
    const btnModernPower = document.getElementById("btn-modern-power");
    const btnModernSource = document.getElementById("btn-modern-source");
    const btnModernMenu = document.getElementById("btn-modern-menu");
    const btnModernVolUp = document.getElementById("btn-modern-vol-up");
    const btnModernVolDown = document.getElementById("btn-modern-vol-down");
    const modernLed = document.getElementById("modern-led");

    // زر التشغيل وإصلاح الشاشة
    if (btnModernPower && modernMonitor) {
      btnModernPower.addEventListener("click", () => {
        const isActive = modernMonitor.classList.toggle("active");
        btnModernPower.classList.toggle("active", isActive);
        if (modernLed) modernLed.classList.toggle("active", isActive);
      });
    }

    // زر تشغيل الموسيقى الرومانسية
    if (btnModernMusic && audioRomantic) {
      btnModernMusic.addEventListener("click", () => {
        if (audioRomantic.paused) {
          stopAllEffects();
          audioRomantic.play().then(() => {
            btnModernMusic.classList.add("active");
          }).catch(() => {});
        } else {
          audioRomantic.pause();
          btnModernMusic.classList.remove("active");
        }
      });
    }

    // أزرار التحكم بالمستوى
    if (btnModernVolUp && audioRomantic) {
      btnModernVolUp.addEventListener("click", () => {
        if (audioRomantic.volume < 1) {
          audioRomantic.volume = Math.min(1, audioRomantic.volume + 0.1);
        }
      });
    }

    if (btnModernVolDown && audioRomantic) {
      btnModernVolDown.addEventListener("click", () => {
        if (audioRomantic.volume > 0) {
          audioRomantic.volume = Math.max(0, audioRomantic.volume - 0.1);
        }
      });
    }

    // أزرار تفاعلية للمصدر والقائمة
    if (btnModernSource) {
      btnModernSource.addEventListener("click", () => {
        btnModernSource.classList.add("active");
        setTimeout(() => btnModernSource.classList.remove("active"), 500);
      });
    }

    if (btnModernMenu) {
      btnModernMenu.addEventListener("click", () => {
        btnModernMenu.classList.add("active");
        setTimeout(() => btnModernMenu.classList.remove("active"), 500);
      });
    }
  </script>
</body>
