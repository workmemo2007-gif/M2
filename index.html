<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* شريط الأقسام */
        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .category-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .category-btn:hover,
        .category-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* حاوية عرض الأطباق (فارغة حالياً) */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .empty-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>قائمة الطعام</h1>
        </header>

        <!-- نظام الأقسام -->
        <nav class="categories-nav" id="categoriesNav">
            <button class="category-btn active" onclick="filterCategory('all')">الكل</button>
            <button class="category-btn" onclick="filterCategory('appetizers')">المقبلات</button>
            <button class="category-btn" onclick="filterCategory('mains')">الأطباق الرئيسية</button>
            <button class="category-btn" onclick="filterCategory('drinks')">المشروبات</button>
            <button class="category-btn" onclick="filterCategory('desserts')">الحلويات</button>
        </nav>

        <!-- منطقة عرض العناصر -->
        <main class="items-grid" id="itemsContainer">
            <div class="empty-message">لا توجد أطباق مضافة حالياً.</div>
        </main>
    </div>

    <script>
        // مصفوفة الأطباق (فارغة جاهزة لتعبئة البيانات مستقبلاً)
        const menuItems = [];

        // نظام تشغيل تصفية الأقسام وعرض العناصر
        function displayItems(category = 'all') {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            const filteredItems = category === 'all' 
                ? menuItems 
                : menuItems.filter(item => item.category === category);

            if (filteredItems.length === 0) {
                container.innerHTML = '<div class="empty-message">لا توجد أطباق في هذا القسم حالياً.</div>';
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.description || ''}</p>
                    <span>${item.price}</span>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(category) {
            // تحديث زر القسم النشط
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // إعادة تشغيل العرض حسب القسم المختار
            displayItems(category);
        }

        // تشغيل النظام عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            displayItems('all');
        });
    </script>
</body>
</html>
