<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية - التجربة السينمائية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --gold-border: rgba(255, 214, 107, 0.85);
      --gold-dark-bg: rgba(250, 247, 240, 0.88);
      --circle-size: clamp(42px, 6vw, 54px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
      background-color: #080b16;
    }

    /* خلفية سينمائية ثابتة بطبقة زوم وحركة متناسقة */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 120%;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: -2;
      will-change: transform;
      transition: transform 0.1s cubic-bezier(0.1, 0, 0.1, 1);
    }

    /* غشاء أسود سينمائي شفاف مع تأثير توهج ليلى */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(16, 26, 53, 0.4), rgba(8, 11, 22, 0.82));
      z-index: -1;
      pointer-events: none;
    }

    /* كانفاس الجزيئات الذهبية المتلألئة (Gold Dust) */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      perspective: 1000px;
    }

    /* حاوية الأقسام */
    .section-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* اللوحة الأولى وحركة الـ 3D Perspective Floating */
    .artwork-wrapper {
      position: relative;
      perspective: 1000px;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.2s ease-out;
    }

    .artwork {
      position: relative;
      width: min(75vw, 70vh, 580px);
      aspect-ratio: 1;
      transform: rotate(4deg) translateZ(20px);
      isolation: isolate;
      transform-style: preserve-3d;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 25px rgba(28, 69, 255, .25));
    }

    /* القسم الثاني والصورة السفلى السينمائية */
    .second-artwork-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      perspective: 1200px;
    }

    .second-artwork {
      width: min(92vw, 88vh, 920px);
      max-width: 100%;
      height: auto;
      border-radius: 20px;
      opacity: 0;
      transform: translateY(-100px) rotateX(12deg) scale(0.92);
      transform-origin: top center;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.8s ease;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 214, 107, 0.15);
      border: 1px solid rgba(255, 214, 107, 0.2);
      will-change: transform, opacity;
    }

    .second-artwork.in-view {
      opacity: 1;
      transform: translateY(0) rotateX(0deg) scale(1);
    }

    /* أزرار الحروف والتصميم التفاعلي */
    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%) translateZ(40px);
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        scale .2s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      scale: 1.08;
    }

    /* مربع النص الشفاف بالأوف وايت والإطار الذهبي */
    .letter-button[aria-pressed="true"] {
      border: 2px solid var(--gold-border);
      background: var(--gold-dark-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #1a1608;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4),
        0 0 25px 8px rgba(255, 214, 107, 0.5),
        inset 0 0 15px rgba(255, 255, 255, 0.9);
      animation: golden-glow 1.8s ease-in-out infinite alternate;
    }

    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(210px, 50vw, 270px);
      height: auto;
      min-height: 100px;
      padding: 12px 16px 16px 16px;
      border-radius: 16px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: #261c02;
      font-weight: 700;
      font-size: clamp(13px, 2vw, 16.5px);
      line-height: 1.55;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 1px rgba(255, 214, 107, 0.3);
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 18px;
      margin-top: 12px;
      padding-top: 4px;
      border-top: 1px solid rgba(180, 135, 25, 0.35);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1.5px;
      height: 100%;
      background-color: #a37913;
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 4px rgba(212, 160, 23, 0.4);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.35; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: #261c02;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 10px 25px rgba(0, 0, 0, 0.3),
          0 0 18px 5px rgba(255, 214, 107, .45),
          inset 0 0 12px rgba(255, 255, 255, .8);
      }
      to {
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.4),
          0 0 32px 12px rgba(255, 220, 120, .85),
          inset 0 0 20px rgba(255, 255, 255, .95);
      }
    }

    /* مواقع أزرار الحروف الدقيقة */
    .letter-ra { left: 82%; top: 87%; }
    .letter-ta { left: 85%; top: 16%; }
    .letter-alif { left: 47%; top: 14%; }
    .letter-jeem { left: 13%; top: 88%; }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }

      .artwork {
        width: min(84vw, 62vh, 420px);
      }

      .second-artwork {
        width: 96vw;
        border-radius: 14px;
      }

      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 195px;
        min-height: 88px;
        padding: 8px 12px 12px 12px;
      }
    }
  </style>
</head>

<body>
  <!-- خلفية سينمائية متفاعلة مع التمرير -->
  <div class="bg-layer" id="bg-layer"></div>
  <div class="bg-overlay"></div>

  <!-- كانفاس ذرات الغبار الذهبي التفاعلي -->
  <canvas id="particles-canvas"></canvas>

  <main aria-label="مساحة عرض الصورة الحرفية السينمائية">
    
    <!-- القسم الأول: اللوحة الحرفية الأولى -->
    <div class="section-container">
      <div class="artwork-wrapper" id="artwork-wrapper">
        <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
          <img
            class="artwork-image"
            src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
            alt="رسم عربي مزخرف"
            draggable="false"
          >

          <!-- حرف الراء -->
          <button
            class="letter-button letter-ra letter-expandable"
            type="button"
            aria-label="حرف الراء"
            aria-pressed="false"
            title="راء"
            data-letter="ra"
          >
            <span class="letter-text">ر</span>
            <div class="typed-container">
              <p class="typed-text" id="typed-text-ra"></p><span class="cursor" id="cursor-ra" style="display:none;"></span>
              <div class="audio-waves">
                <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
              </div>
            </div>
          </button>

          <!-- حرف التاء -->
          <button
            class="letter-button letter-ta letter-expandable"
            type="button"
            aria-label="حرف التاء"
            aria-pressed="false"
            title="تاء"
            data-letter="ta"
          >
            <span class="letter-text">ت</span>
            <div class="typed-container">
              <p class="typed-text" id="typed-text-ta"></p><span class="cursor" id="cursor-ta" style="display:none;"></span>
              <div class="audio-waves">
                <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
              </div>
            </div>
          </button>

          <!-- حرف الألف -->
          <button
            class="letter-button letter-alif letter-expandable"
            type="button"
            aria-label="حرف الألف"
            aria-pressed="false"
            title="ألف"
            data-letter="alif"
          >
            <span class="letter-text">ا</span>
            <div class="typed-container">
              <p class="typed-text" id="typed-text-alif"></p><span class="cursor" id="cursor-alif" style="display:none;"></span>
              <div class="audio-waves">
                <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
              </div>
            </div>
          </button>

          <!-- حرف الجيم -->
          <button
            class="letter-button letter-jeem letter-expandable"
            type="button"
            aria-label="حرف الجيم"
            aria-pressed="false"
            title="جيم"
            data-letter="jeem"
          >
            <span class="letter-text">ج</span>
            <div class="typed-container">
              <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>
              <div class="audio-waves">
                <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
              </div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- القسم الثاني: الصورة السفلى مع ظهور وانزلاق سينمائي من الأعلى -->
    <div class="second-artwork-container">
      <img
        id="second-img"
        class="second-artwork"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/0149a0188b038d7e73aaf2206e6f9246c21be553/IMG_2577.png"
        alt="صورة إضافية"
        draggable="false"
      >
    </div>

  </main>

  <!-- الأصوات الموسيقية والشعرية -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-alif" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/72ad2bf2d4691e866f88413a9f1bd6a809c2c125/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%A7%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* =========================================
       1. الجزيئات الذهبية الشفافة (Gold Particles)
       ========================================= */
    const canvas = document.getElementById("particles-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const numParticles = 45;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedY = Math.random() * -0.6 - 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.pulse = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += Math.sin(Date.now() * this.pulse) * 0.01;

        if (this.y < 0) this.y = canvas.height;
        if (this.x < 0 || this.x > canvas.width) this.x = Math.random() * canvas.width;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 220, 130, ${Math.max(0.1, Math.min(1, this.alpha))})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(255, 214, 107, 0.8)";
        ctx.fill();
      }
    }

    for (let i = 0; i < numParticles; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* =========================================
       2. الحركة السينمائية الموحدة للجميع (Parallax & Tilt)
       ========================================= */
    const bgLayer = document.getElementById("bg-layer");
    const artworkWrapper = document.getElementById("artwork-wrapper");
    const secondImg = document.getElementById("second-img");

    window.addEventListener("scroll", () => {
      const scrollY = window.pageYOffset;
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      const scrollProgress = Math.min(1, Math.max(0, scrollY / (totalScroll || 1)));

      // 1. حركة الخلفية: تكبير طفيف ونزول تدريجي
      const bgY = scrollY * 0.25;
      const bgScale = 1 + scrollProgress * 0.08;
      bgLayer.style.transform = `translate3d(0, ${bgY}px, 0) scale(${bgScale})`;

      // 2. حركة اللوحة الأولى: دوران 3D خفيف مع ابتعاد تدريجي عند النزول
      const artworkY = scrollY * 0.12;
      const artworkRotateX = scrollProgress * 8;
      const artworkScale = Math.max(0.88, 1 - scrollProgress * 0.2);
      artworkWrapper.style.transform = `translate3d(0, ${artworkY}px, 0) rotateX(${artworkRotateX}deg) scale(${artworkScale})`;
    });

    // مراقبة الصورة الثانية لتفعيل أنيميشن السحب التلقائي
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          secondImg.classList.add("in-view");
        }
      });
    }, { threshold: 0.12 });

    observer.observe(secondImg);

    /* =========================================
       3. أزرار الحروف والتكست والكتابة الصوتية
       ========================================= */
    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 120) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", (e) => {
        e.stopPropagation();
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 120);
          }
        }
      });
    });
  </script>
</body>
</html>
