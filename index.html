<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --gold-dark-bg: rgba(30, 22, 10, 0.92);
      --off-white-translucent: rgba(250, 248, 242, 0.18);
      --off-white-glow: rgba(255, 253, 245, 0.95);
      --gold-border: rgba(255, 214, 107, 0.85);
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      will-change: background-position;
    }

    /* غشاء أسود شفاف لإبراز الكتابات والنصوص */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    .section-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      position: relative;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;
      transform: rotate(5deg);
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    /* تصميم عرض الصورة الثانية */
    .second-artwork-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px 10px 10px;
      box-sizing: border-box;
    }

    .second-artwork {
      width: min(95vw, 90vh, 1000px);
      max-width: 100%;
      height: auto;
      border: none;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
      opacity: 0;
      transform: translateY(120px) scale(0.92);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    .second-artwork.slide-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* تصميم قسم الشاشة المعطلة أسفل الصورة الثانية مباشرة */
    .broken-screen-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 15px 120px 15px;
      margin-top: -10px;
    }

    .broken-screen-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .broken-screen-box {
      position: relative;
      z-index: 2;
      /* حجم يتناسب مع حجم الصورة الثانية */
      width: min(88vw, 75vh, 750px);
      aspect-ratio: 1600 / 2000;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      /* زيادة سماكة الإطار وإعطاء مظهر 3D بارز */
      border: 12px solid #0e1526;
      box-shadow: 
        0 0 0 2px rgba(255, 214, 107, 0.5),
        0 20px 50px rgba(0, 0, 0, 0.95),
        inset 0 0 25px rgba(0, 0, 0, 0.9);
      transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
      background-color: #000;
    }

    .broken-screen-box:hover {
      transform: scale(1.015);
      border-color: #16223d;
      box-shadow: 
        0 0 0 3px rgba(255, 214, 107, 0.8),
        0 25px 60px rgba(0, 0, 0, 1),
        0 0 30px rgba(255, 214, 107, 0.3);
    }

    .broken-screen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: blur(28px) contrast(220%) brightness(55%) saturate(180%);
      transition: filter 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s ease;
      animation: static-flicker 1.8s infinite alternate ease-in-out;
      user-select: none;
      -webkit-user-drag: none;
    }

    .screen-glitch-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.35) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.8s ease;
      animation: glitch-scanlines 0.25s infinite linear;
    }

    .screen-hint-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold-bright);
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 18px var(--gold);
      z-index: 3;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.6s ease;
      animation: pulse-hint 1.4s infinite alternate;
      width: 80%;
    }

    /* كشف الشاشة بعد النقر */
    .broken-screen-box.revealed .broken-screen-img {
      filter: blur(0px) contrast(100%) brightness(100%) saturate(100%);
      animation: none;
    }

    .broken-screen-box.revealed .screen-glitch-overlay,
    .broken-screen-box.revealed .screen-hint-text {
      opacity: 0;
    }

    /* أسلاك التوصيل 3D التفاعلية */
    .cables-container {
      position: relative;
      width: min(88vw, 75vh, 750px);
      height: 140px;
      margin-top: -12px;
      z-index: 1;
      pointer-events: none;
    }

    .cables-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 10px rgba(0,0,0,0.9));
    }

    .cable-path {
      fill: none;
      stroke-linecap: round;
    }

    /* أسلاك 3D ذات تدرج لوني مجسم */
    .cable-1 { stroke: url(#cableGrad1); stroke-width: 12; }
    .cable-2 { stroke: url(#cableGrad2); stroke-width: 16; }
    .cable-3 { stroke: url(#cableGrad1); stroke-width: 13; }

    /* أنيميشن حركة نبضات الكهرباء والطاقة داخل الأسلاك */
    .cable-pulse {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 40 220;
      animation: flowPulse linear infinite;
    }

    .pulse-1 { stroke: #60a5fa; stroke-width: 6; filter: drop-shadow(0 0 8px #3b82f6); animation-duration: 1.8s; }
    .pulse-2 { stroke: #ffd66b; stroke-width: 8; filter: drop-shadow(0 0 10px #ffd66b); animation-duration: 2.3s; animation-delay: 0.3s; }
    .pulse-3 { stroke: #60a5fa; stroke-width: 6; filter: drop-shadow(0 0 8px #3b82f6); animation-duration: 2s; animation-delay: 0.7s; }

    @keyframes flowPulse {
      0% { stroke-dashoffset: 260; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes static-flicker {
      0% { filter: blur(22px) contrast(180%) brightness(50%) hue-rotate(0deg); }
      25% { filter: blur(28px) contrast(240%) brightness(80%) hue-rotate(90deg); }
      50% { filter: blur(18px) contrast(160%) brightness(40%) hue-rotate(180deg); }
      75% { filter: blur(32px) contrast(260%) brightness(75%) hue-rotate(270deg); }
      100% { filter: blur(25px) contrast(200%) brightness(60%) hue-rotate(360deg); }
    }

    @keyframes glitch-scanlines {
      0% { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    @keyframes pulse-hint {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.96); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        transform .4s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .letter-button[aria-pressed="true"] {
      border: 2px solid var(--gold-bright);
      background: rgba(252, 249, 240, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-bright);
      box-shadow:
        0 0 20px 6px rgba(255, 214, 107, 0.45),
        0 0 40px 14px rgba(255, 194, 54, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.25);
      animation: golden-glow 1.8s ease-in-out infinite alternate;
    }

    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(210px, 48vw, 260px);
      height: auto;
      min-height: 100px;
      padding: 10px 14px 14px 14px;
      border-radius: 16px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--off-white-glow);
      font-size: clamp(13px, 1.9vw, 16px);
      line-height: 1.6;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 214, 107, 0.7);
      font-weight: 700;
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 18px;
      margin-top: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 214, 107, 0.35);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1px;
      height: 100%;
      background-color: var(--gold-bright);
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 6px rgba(255, 214, 107, 0.7);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold-bright);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 14px 4px rgba(255, 211, 94, .5),
          0 0 28px 8px rgba(255, 194, 54, .3),
          inset 0 0 14px rgba(255, 255, 255, .2);
      }
      to {
        box-shadow:
          0 0 22px 8px rgba(255, 231, 153, .8),
          0 0 45px 18px rgba(255, 194, 54, .5),
          inset 0 0 22px rgba(255, 255, 255, .35);
      }
    }

    .letter-ra { left: 82%; top: 87%; }
    
    .letter-ta { left: 85%; top: 16%; }
    .letter-ta[aria-pressed="true"] {
      transform: translate(-100%, -100%);
      transform-origin: bottom right;
    }

    .letter-alif { left: 47%; top: 14%; }

    .letter-jeem { left: 13%; top: 88%; }
    .letter-jeem[aria-pressed="true"] {
      transform: translate(0, 0);
      transform-origin: top left;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }
      .artwork {
        width: min(82vw, 64vh, 420px);
      }
      .second-artwork {
        width: 100vw;
      }
      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 200px;
        min-height: 85px;
        padding: 8px 10px 10px 10px;
      }
    }
  </style>
</head>

<body>
  <main aria-label="مساحة عرض الصورة الحرفية">
    
    <div class="section-container">
      <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
        <img
          class="artwork-image"
          src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
          alt="رسم عربي مزخرف"
          draggable="false"
        >

        <!-- حرف الراء -->
        <button
          class="letter-button letter-ra letter-expandable"
          type="button"
          aria-label="حرف الراء"
          aria-pressed="false"
          title="راء"
          data-letter="ra"
        >
          <span class="letter-text">ر</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ra"></p><span class="cursor" id="cursor-ra" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف التاء -->
        <button
          class="letter-button letter-ta letter-expandable"
          type="button"
          aria-label="حرف التاء"
          aria-pressed="false"
          title="تاء"
          data-letter="ta"
        >
          <span class="letter-text">ت</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ta"></p><span class="cursor" id="cursor-ta" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الألف -->
        <button
          class="letter-button letter-alif letter-expandable"
          type="button"
          aria-label="حرف الألف"
          aria-pressed="false"
          title="ألف"
          data-letter="alif"
        >
          <span class="letter-text">ا</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-alif"></p><span class="cursor" id="cursor-alif" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الجيم -->
        <button
          class="letter-button letter-jeem letter-expandable"
          type="button"
          aria-label="حرف الجيم"
          aria-pressed="false"
          title="جيم"
          data-letter="jeem"
        >
          <span class="letter-text">ج</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- القسم الثاني: الصورة العائمة -->
    <div class="second-artwork-container">
      <img
        id="second-img"
        class="second-artwork"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/adadf85a0ca189e75ecac30f00924564fbb59352/IMG_2577.png"
        alt="صورة عائمة جديدة"
        draggable="false"
      >
    </div>

    <!-- القسم الثالث: الشاشة المعطلة مباشرة أسفل الصورة الثانية -->
    <div class="broken-screen-container">
      <div class="broken-screen-wrapper">
        <div class="broken-screen-box" id="broken-screen-box" title="انقر لإصلاح الشاشة">
          <img
            class="broken-screen-img"
            src="https://raw.githubusercontent.com/workmemo2007-gif/M2/cf0d61006943027ac1c821b662336a6501d8641d/IMG_2592.jpeg"
            alt="الصورة المعروضة"
            draggable="false"
          >
          <div class="screen-glitch-overlay"></div>
          <div class="screen-hint-text">اضغط لإصلاح الشاشة ⚡</div>
        </div>

        <!-- أسلاك التوصيل ثلاثية الأبعاد 3D المتصلة من الأسفل -->
        <div class="cables-container">
          <svg class="cables-svg" viewBox="0 0 800 160" preserveAspectRatio="none">
            <defs>
              <!-- تدرج ألوان مجسم للأسلاك -->
              <linearGradient id="cableGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#090d1a"/>
                <stop offset="45%" stop-color="#2563eb"/>
                <stop offset="70%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#0a1020"/>
              </linearGradient>
              <linearGradient id="cableGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#141005"/>
                <stop offset="40%" stop-color="#d97706"/>
                <stop offset="75%" stop-color="#ffd66b"/>
                <stop offset="100%" stop-color="#120e03"/>
              </linearGradient>
            </defs>

            <!-- المسارات الأساسية للأسلاك الضخمة 3D -->
            <path class="cable-path cable-1" d="M 180 160 C 220 90, 310 50, 360 0" />
            <path class="cable-path cable-2" d="M 400 160 C 400 100, 400 40, 400 0" />
            <path class="cable-path cable-3" d="M 620 160 C 580 90, 490 50, 440 0" />

            <!-- حركة تدفق نبضات الكهرباء داخل الأسلاك -->
            <path class="cable-pulse pulse-1" d="M 180 160 C 220 90, 310 50, 360 0" />
            <path class="cable-pulse pulse-2" d="M 400 160 C 400 100, 400 40, 400 0" />
            <path class="cable-pulse pulse-3" d="M 620 160 C 580 90, 490 50, 440 0" />
          </svg>
        </div>
      </div>
    </div>

  </main>

  <!-- الأصوات -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">

  </audio>

  <audio id="audio-alif" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/72ad2bf2d4691e866f88413a9f1bd6a809c2c125/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%A7%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <script>
    function updateBackgroundOnScroll() {
      const scrollY = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      
      if (maxScroll > 0) {
        const scrollPercent = (scrollY / maxScroll) * 100;
        document.body.style.backgroundPositionY = `${scrollPercent}%`;
      }
    }

    window.addEventListener("scroll", updateBackgroundOnScroll);
    window.addEventListener("resize", updateBackgroundOnScroll);

    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 130) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 130);
          }
        }
      });
    });

    const secondImg = document.getElementById("second-img");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          secondImg.classList.add("slide-in");
        }
      });
    }, { threshold: 0.15 });

    observer.observe(secondImg);

    const brokenScreenBox = document.getElementById("broken-screen-box");
    if (brokenScreenBox) {
      brokenScreenBox.addEventListener("click", () => {
        brokenScreenBox.classList.toggle("revealed");
      });
    }
  </script>
</body>
</html>
