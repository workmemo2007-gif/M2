<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>مخطوطة رتاج التفاعلية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --blue: #60a5fa;
      --blue-bright: #93c5fd;
      --gold: #ffd700;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      background-color: #0d1117;
      background-image:
        linear-gradient(180deg, rgba(5, 10, 20, .22), rgba(5, 10, 20, .40)),
        url('https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Amiri', serif;
    }

    main {
      width: min(100%, 1080px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .stage {
      position: relative;
      width: min(100%, 900px);
      height: clamp(300px, 58vw, 430px);
      min-height: 300px;
      overflow: visible;
      isolation: isolate;
    }

    .name {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      direction: rtl;
      white-space: nowrap;
      font-size: clamp(100px, 20vw, 190px);
      font-weight: 700;
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 0 8px rgba(96, 165, 250, .95),
                   0 0 22px rgba(59, 130, 246, .85),
                   0 0 48px rgba(29, 78, 216, .65);
      user-select: none;
    }

    .letter {
      display: inline;
      color: #fff;
      cursor: pointer;
      transition: color .28s ease, text-shadow .28s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .letter:hover,
    .letter:focus-visible {
      outline: none;
      text-shadow: 0 0 10px #bfdbfe, 0 0 28px #3b82f6, 0 0 55px #2563eb;
    }

    .letter.active {
      color: var(--gold);
      text-shadow: 0 0 9px var(--gold), 0 0 24px #ffaa00, 0 0 48px rgba(255, 170, 0, .85);
    }

    .callouts {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .callout {
      pointer-events: auto;
      cursor: pointer;
      outline: none;
    }

    .connector-line {
      fill: none;
      stroke: rgba(191, 219, 254, .88);
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
      transition: stroke .25s ease, stroke-width .25s ease, filter .25s ease;
    }

    .circle-node {
      fill: rgba(255, 255, 255, .035);
      stroke: var(--blue);
      stroke-width: 1.6;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 6px rgba(59, 130, 246, .95));
      transition: fill .25s ease, stroke .25s ease, filter .25s ease;
    }

    .circle-text {
      fill: #fff;
      font-family: 'Amiri', serif;
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill .25s ease;
    }

    .callout:hover .circle-node,
    .callout:focus-visible .circle-node {
      stroke: #bfdbfe;
      filter: drop-shadow(0 0 9px #60a5fa);
    }

    .callout.active .connector-line {
      stroke: var(--gold);
      stroke-width: 2;
      filter: drop-shadow(0 0 5px var(--gold));
    }

    .callout.active .circle-node {
      stroke: var(--gold);
      fill: rgba(255, 215, 0, .08);
      filter: drop-shadow(0 0 9px var(--gold));
    }

    .callout.active .circle-text { fill: var(--gold); }

    @media (max-width: 520px) {
      main { padding-inline: 12px; }
      .stage { height: 310px; }
      .name { font-size: clamp(92px, 23vw, 122px); }
      .circle-node { stroke-width: 1.4; }
      .circle-text { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="مخطوطة رتاج التفاعلية">
      <div class="name" id="name" aria-label="رتاج">
        <span class="letter" data-letter="ر" role="button" tabindex="0" aria-label="حرف الراء">ر</span><span class="letter" data-letter="ت" role="button" tabindex="0" aria-label="حرف التاء">ت</span><span class="letter" data-letter="ا" role="button" tabindex="0" aria-label="حرف الألف">ا</span><span class="letter" data-letter="ج" role="button" tabindex="0" aria-label="حرف الجيم">ج</span>
      </div>
      <svg class="callouts" id="callouts" aria-label="دوائر الحروف" role="group"></svg>
    </section>
  </main>

  <script>
    (() => {
      const stage = document.querySelector('.stage');
      const svg = document.getElementById('callouts');
      const letters = [...document.querySelectorAll('.letter')];
      const svgNS = 'http://www.w3.org/2000/svg';
      const callouts = new Map();

      function svgElement(tag, attributes = {}) {
        const element = document.createElementNS(svgNS, tag);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        return element;
      }

      letters.forEach((letter, index) => {
        const group = svgElement('g', {
          class: 'callout',
          tabindex: '0',
          role: 'button',
          'aria-label': `تحديد حرف ${letter.dataset.letter}`,
          'data-index': index
        });
        const line = svgElement('line', { class: 'connector-line' });
        const circle = svgElement('circle', { class: 'circle-node', r: '23' });
        const text = svgElement('text', { class: 'circle-text' });
        text.textContent = letter.dataset.letter;
        group.append(line, circle, text);
        group.addEventListener('click', () => selectLetter(index));
        group.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectLetter(index);
          }
        });
        svg.appendChild(group);
        callouts.set(index, { group, line, circle, text });

        letter.addEventListener('click', () => selectLetter(index));
        letter.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectLetter(index);
          }
        });
      });

      function selectLetter(selectedIndex) {
        letters.forEach((letter, index) => {
          const active = index === selectedIndex && !letter.classList.contains('active');
          letter.classList.toggle('active', active);
          callouts.get(index).group.classList.toggle('active', active);
          callouts.get(index).group.setAttribute('aria-pressed', String(active));
        });
      }

      function positionCallouts() {
        const stageRect = stage.getBoundingClientRect();
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.setAttribute('preserveAspectRatio', 'none');

        letters.forEach((letter, index) => {
          const rect = letter.getBoundingClientRect();
          const x = rect.left - stageRect.left + rect.width / 2;
          const startY = rect.top - stageRect.top + Math.max(4, rect.height * .22);
          const radius = 23;
          const nodeY = Math.max(radius + 9, Math.min(58, height * .17));
          const endY = nodeY + radius;
          const { line, circle, text } = callouts.get(index);
          line.setAttribute('x1', x);
          line.setAttribute('y1', startY);
          line.setAttribute('x2', x);
          line.setAttribute('y2', endY);
          circle.setAttribute('cx', x);
          circle.setAttribute('cy', nodeY);
          text.setAttribute('x', x);
          text.setAttribute('y', nodeY + 1);
        });
      }

      const resizeObserver = new ResizeObserver(positionCallouts);
      resizeObserver.observe(stage);
      window.addEventListener('load', positionCallouts);
      window.addEventListener('resize', positionCallouts);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionCallouts);
      requestAnimationFrame(positionCallouts);
    })();
  </script>
</body>
</html>
