<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --gold-dark-bg: rgba(30, 22, 10, 0.92);
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* منع التمرير الأفقي فقط والسماح بالرأسي */
      overflow-y: auto;   /* التمرير لأسفل */
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* غشاء أسود شفاف لإبراز الكتابات والنصوص */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    /* حاوية تضمن عرض كل قسم بكامل الشاشة */
    .section-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      position: relative;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;
      transform: rotate(5deg);
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    /* تصميم أنيميشن ظهور الصورة الثانية وتغبيشها */
    .second-artwork-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .second-artwork {
      width: min(72vw, 68vh, 560px);
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      cursor: pointer;
      /* أنيميشن التغبيش */
      filter: blur(12px) opacity(0.7);
      transform: translateY(40px);
      transition: filter 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* ظهور الصورة حركة (Fade/Slide Up) عند التمرير إليها */
    .second-artwork.in-view {
      transform: translateY(0);
    }

    /* عند النقر لإزالة التغبيش */
    .second-artwork.unblurred {
      filter: blur(0px) opacity(1);
      box-shadow: 0 0 35px rgba(255, 214, 107, 0.4);
    }

    .click-hint {
      color: var(--gold-bright);
      margin-top: 15px;
      font-size: 1.1rem;
      text-shadow: 0 0 8px rgba(255, 214, 107, 0.6);
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        scale .2s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      scale: 1.05;
    }

    .letter-button[aria-pressed="true"] {
      border-color: var(--gold-bright);
      background: var(--gold-dark-bg);
      color: var(--gold-bright);
      box-shadow:
        0 0 15px 4px rgba(255, 211, 94, .85),
        0 0 34px 12px rgba(255, 194, 54, .62),
        inset 0 0 14px rgba(255, 214, 107, .3);
      animation: golden-glow 1.5s ease-in-out infinite alternate;
    }

    /* التوسع الأفقي للحروف المفعلة عند الضغط عليها (حجم مصغر) */
    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(190px, 45vw, 240px);
      height: auto;
      min-height: 90px;
      padding: 8px 12px 12px 12px;
      border-radius: 14px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--gold-bright);
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.5;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 6px rgba(255, 214, 107, 0.6);
    }

    /* مؤشر ذبذبات الصوت بطول المربع */
    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 16px;
      margin-top: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 214, 107, 0.2);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1px;
      height: 100%;
      background-color: var(--gold-bright);
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 4px rgba(255, 214, 107, 0.5);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold-bright);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 10px 3px rgba(255, 211, 94, .72),
          0 0 25px 8px rgba(255, 194, 54, .42),
          inset 0 0 12px rgba(255, 214, 107, .25);
      }

      to {
        box-shadow:
          0 0 17px 6px rgba(255, 231, 153, .96),
          0 0 40px 16px rgba(255, 194, 54, .68),
          inset 0 0 18px rgba(255, 214, 107, .45);
      }
    }

    /* مواقع الدوائر عند نهايات الأسهم في الصورة الأولى */
    .letter-ra {
      left: 82%;
      top: 87%;
    }

    .letter-ta {
      left: 85%;
      top: 16%;
    }

    .letter-alif {
      left: 47%;
      top: 14%;
    }

    .letter-jeem {
      left: 13%;
      top: 88%;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }

      .artwork {
        width: min(82vw, 64vh, 420px);
      }

      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 180px;
        min-height: 80px;
        padding: 6px 10px 10px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main aria-label="مساحة عرض الصورة الحرفية">
    
    <!-- القسم الأول: الصورة الأولى الحرفية والتفاعلية -->
    <div class="section-container">
      <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
        <img
          class="artwork-image"
          src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
          alt="رسم عربي مزخرف"
          draggable="false"
        >

        <!-- حرف الراء -->
        <button
          class="letter-button letter-ra letter-expandable"
          type="button"
          aria-label="حرف الراء"
          aria-pressed="false"
          title="راء"
          data-letter="ra"
        >
          <span class="letter-text">ر</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ra"></p><span class="cursor" id="cursor-ra" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف التاء -->
        <button
          class="letter-button letter-ta letter-expandable"
          type="button"
          aria-label="حرف التاء"
          aria-pressed="false"
          title="تاء"
          data-letter="ta"
        >
          <span class="letter-text">ت</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ta"></p><span class="cursor" id="cursor-ta" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الألف -->
        <button
          class="letter-button letter-alif letter-expandable"
          type="button"
          aria-label="حرف الألف"
          aria-pressed="false"
          title="ألف"
          data-letter="alif"
        >
          <span class="letter-text">ا</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-alif"></p><span class="cursor" id="cursor-alif" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الجيم -->
        <button
          class="letter-button letter-jeem letter-expandable"
          type="button"
          aria-label="حرف الجيم"
          aria-pressed="false"
          title="جيم"
          data-letter="jeem"
        >
          <span class="letter-text">ج</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- القسم الثاني: الصورة الجديدة أسفل الأولى -->
    <div class="second-artwork-container">
      <img
        id="second-img"
        class="second-artwork"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/b9925077ebb16aeeb6ec9fd1c7efad5b9d683e2b/IMG_2576.png"
        alt="صورة إضافية"
        draggable="false"
      >
      <span class="click-hint" id="hint-text">اضغط على الصورة لإظهار تفاصيلها ✨</span>
    </div>

  </main>

  <!-- الأصوات -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-alif" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/72ad2bf2d4691e866f88413a9f1bd6a809c2c125/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%A7%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <script>
    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 130) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 130);
          }
        }
      });
    });

    // ----------------------------------------------------
    // تأثير التمرير والنقر للصورة الثانية
    // ----------------------------------------------------
    const secondImg = document.getElementById("second-img");
    const hintText = document.getElementById("hint-text");

    // إزالة التغبيش عند النقر
    secondImg.addEventListener("click", () => {
      secondImg.classList.toggle("unblurred");
      if(secondImg.classList.contains("unblurred")) {
        hintText.style.opacity = "0";
      } else {
        hintText.style.opacity = "1";
      }
    });

    // مراقبة الوصول للصورة الثانية لتفعيل أنيميشن الحركة (Slide Up) عند التمرير
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          secondImg.classList.add("in-view");
        }
      });
    }, { threshold: 0.2 });

    observer.observe(secondImg);
  </script>
</body>
</html>
