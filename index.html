<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --gold-dark-bg: rgba(30, 22, 10, 0.92);
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto; /* السماح بالتمرير لرؤية الصورة الثانية */
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* غشاء أسود شفاف لإبراز الكتابات والنصوص */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 15px 100px;
      gap: 120px; /* مسافة بين الصورة الأولى والتعليمات/الصورة الثانية */
    }

    /* القسم الأول: الصورة الأولى الحرفية والتفاعلية */
    .artwork-section {
      position: relative;
      width: 100%;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      position: relative;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;
      transform: rotate(5deg);
      pointer-events: none;
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        scale .2s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      scale: 1.05;
    }

    .letter-button[aria-pressed="true"] {
      border-color: var(--gold-bright);
      background: var(--gold-dark-bg);
      color: var(--gold-bright);
      box-shadow:
        0 0 15px 4px rgba(255, 211, 94, .85),
        0 0 34px 12px rgba(255, 194, 54, .62),
        inset 0 0 14px rgba(255, 214, 107, .3);
      animation: golden-glow 1.5s ease-in-out infinite alternate;
    }

    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(190px, 45vw, 240px);
      height: auto;
      min-height: 90px;
      padding: 8px 12px 12px 12px;
      border-radius: 14px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--gold-bright);
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.5;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 6px rgba(255, 214, 107, 0.6);
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 16px;
      margin-top: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 214, 107, 0.2);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1px;
      height: 100%;
      background-color: var(--gold-bright);
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 4px rgba(255, 214, 107, 0.5);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold-bright);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 10px 3px rgba(255, 211, 94, .72),
          0 0 25px 8px rgba(255, 194, 54, .42),
          inset 0 0 12px rgba(255, 214, 107, .25);
      }
      to {
        box-shadow:
          0 0 17px 6px rgba(255, 231, 153, .96),
          0 0 40px 16px rgba(255, 194, 54, .68),
          inset 0 0 18px rgba(255, 214, 107, .45);
      }
    }

    .letter-ra { left: 82%; top: 87%; }
    .letter-ta { left: 85%; top: 16%; }
    .letter-alif { left: 47%; top: 14%; }
    .letter-jeem { left: 13%; top: 88%; }

    /* ========================================================
       القسم الثاني: الصورة الجديدة المصممة مع التمويه والتنبثق
       ======================================================== */
    .second-image-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;

      /* تأثير الحراك المبدئي عند التمرير */
      opacity: 0;
      transform: translateY(60px) scale(0.92);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* كلاس التفعيل عند التمرير لأسفل */
    .second-image-section.reveal {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .blur-wrapper {
      position: relative;
      cursor: pointer;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 214, 107, 0.2);
      border: 2px solid rgba(255, 214, 107, 0.3);
      transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .blur-wrapper:hover {
      transform: scale(1.03);
      border-color: var(--gold);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 214, 107, 0.5);
    }

    .second-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: cover;
      /* تأثير التغبيش والضبابية الإفتراضي */
      filter: blur(12px) brightness(0.8);
      transition: filter 0.5s ease, transform 0.5s ease;
      user-select: none;
    }

    /* نص إرشادي يظهر على الصورة المغوشة */
    .blur-overlay-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold-bright);
      background: rgba(8, 11, 22, 0.75);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--gold);
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    /* النافذة المنبثقة عند النقر على الصورة (Pop-up Modal) */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .image-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      transform: scale(0.7);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .image-modal.active .modal-content {
      transform: scale(1);
    }

    .modal-content img {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      border: 2px solid var(--gold);
      box-shadow: 0 0 35px rgba(255, 214, 107, 0.4);
    }

    .close-modal {
      position: absolute;
      top: -18px;
      right: -18px;
      width: 40px;
      height: 40px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }

      .artwork {
        width: min(82vw, 64vh, 420px);
      }

      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 180px;
        min-height: 80px;
        padding: 6px 10px 10px 10px;
      }

      .blur-overlay-text {
        font-size: 14px;
        padding: 8px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container" aria-label="مساحة عرض الصور التفاعلية">
    <!-- الصورة الأولى الأصلية التفاعلية -->
    <section class="artwork-section">
      <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
        <img
          class="artwork-image"
          src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
          alt="رسم عربي مزخرف"
          draggable="false"
        >

        <!-- حرف الراء -->
        <button
          class="letter-button letter-ra letter-expandable"
          type="button"
          aria-label="حرف الراء"
          aria-pressed="false"
          title="راء"

        >
          <span class="letter-text">ر</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ra"></p><span class="cursor" id="cursor-ra" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف التاء -->
        <button
          class="letter-button letter-ta letter-expandable"
          type="button"
          aria-label="حرف التاء"
          aria-pressed="false"
          title="تاء"
          data-letter="ta"
        >
          <span class="letter-text">ت</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-ta"></p><span class="cursor" id="cursor-ta" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الألف -->
        <button
          class="letter-button letter-alif letter-expandable"
          type="button"
          aria-label="حرف الألف"
          aria-pressed="false"
          title="ألف"
          data-letter="alif"
        >
          <span class="letter-text">ا</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-alif"></p><span class="cursor" id="cursor-alif" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الجيم -->
        <button
          class="letter-button letter-jeem letter-expandable"
          type="button"
          aria-label="حرف الجيم"
          aria-pressed="false"
          title="جيم"
          data-letter="jeem"
        >
          <span class="letter-text">ج</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>
      </div>
    </section>

    <!-- الصورة الثانية المضافة أسفل الصورة الأولى مع الضبابية والحركة -->
    <section class="second-image-section" id="secondImageSection">
      <div class="blur-wrapper" id="blurImageContainer" title="انقر لتوضيح الصورة">
        <img
          class="second-image"
          src="https://raw.githubusercontent.com/workmemo2007-gif/J/d27e3eedd926c2a3dd38928541dd92d7b7a6af08/Picsart_26-09-29_13-48-13-069.png"
          alt="الصورة المضافة"
        >
        <div class="blur-overlay-text">انقر لإظهار الصورة ✦</div>
      </div>
    </section>
  </main>

  <!-- نافذة التكبير المنبثقة للوضوح التام -->
  <div class="image-modal" id="imageModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">&times;</button>
      <img
        src="https://raw.githubusercontent.com/workmemo2007-gif/J/d27e3eedd926c2a3dd38928541dd92d7b7a6af08/Picsart_26-09-29_13-48-13-069.png"
        alt="الصورة بوضوح تام"
      >
    </div>
  </div>

  <!-- الأصوات الخفية التي تعمل عند التوسيع -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-alif" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/72ad2bf2d4691e866f88413a9f1bd6a809c2c125/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%A7%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <script>
    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 130) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("
