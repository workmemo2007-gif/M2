<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصميم التلفاز</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* 1. تكبير حجم هيكل التلفاز */
    .tv-frame {
      width: 750px;
      max-width: 95vw;
      background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  inset 0 2px 3px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 3. الشاشة في أعلى التلفاز بالوضع الأفقي */
    .tv-screen {
      width: 100%;
      height: 420px; /* العرض والأرتفاع بالوضع الأفقي */
      background: #050505;
      border-radius: 10px;
      border: 4px solid #111;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
    }

    /* محتوى الشاشة (تم إزالة النص المطلوب) */
    .screen-content {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1b2838 0%, #0d1117 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* انعكاس إضاءة الشاشة */
    .screen-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 4. شريط الأزرار أسفل الشاشة بالوضع الأفقي */
    .tv-controls-bar {
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: row; /* وضع أفقي للأزرار */
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
    }

    .brand-logo {
      color: #666;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* مجموعة الأزرار الأفقية */
    .buttons-group {
      display: flex;
      flex-direction: row; /* أزرار مجتمعة أفقياً */
      gap: 12px;
      align-items: center;
    }

    .tv-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #3a3a3a, #222);
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4),
                  inset 0 1px 1px rgba(255,255,255,0.2);
      transition: all 0.2s ease;
    }

    .tv-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .tv-btn.power {
      background: linear-gradient(145deg, #d32f2f, #9a0007);
      color: white;
    }

    .power-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    /* قاعدة التلفاز السفلية */
    .tv-stand {
      width: 240px;
      height: 12px;
      background: #1a1a1a;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div style="display: flex; flex-direction: column; align-items: center;">
    <!-- هيكل التلفاز -->
    <div class="tv-frame">
      
      <!-- 3. الشاشة في أعلى التلفاز بالوضع الأفقي -->
      <div class="tv-screen">
        <div class="screen-content">
          <!-- 2. تم حذف كتابة (اضغط للاصلاح) -->
        </div>
        <div class="screen-glow"></div>
      </div>

      <!-- 4. الأزرار أسفل الشاشة مرتبة أفقياً -->
      <div class="tv-controls-bar">
        <div class="power-led" title="مؤشر التشغيل"></div>
        <span class="brand-logo">SMART TV</span>
        
        <div class="buttons-group">
          <button class="tv-btn" title="القناة التالية">▲</button>
          <button class="tv-btn" title="القناة السابقة">▼</button>
          <button class="tv-btn" title="رفع الصوت">+</button>
          <button class="tv-btn" title="خفض الصوت">-</button>
          <button class="tv-btn power" title="تشغيل / إيقاف">⏁</button>
        </div>
      </div>

    </div>

    <!-- قاعدة التلفاز (5. بدون أسلاك توصيل) -->
    <div class="tv-stand"></div>
  </div>

</body>
</html>
