<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصورة التفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* التنسيقات الخاصة بالدوائر التفاعلية */
        .interactive-circle {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .interactive-circle circle {
            fill: rgba(15, 23, 42, 0.85);
            stroke: #38bdf8;
            stroke-width: 3;
            transition: all 0.3s ease;
        }

        .interactive-circle text {
            fill: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 24px;
            user-select: none;
            transition: all 0.3s ease;
        }

        .interactive-circle:hover circle {
            stroke: #fbbf24;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
        }

        /* تأثير التوهج الذهبي عند النقر */
        .interactive-circle.active circle {
            fill: #fbbf24 !important;
            stroke: #fff7ed !important;
            filter: drop-shadow(0 0 18px #fbbf24) drop-shadow(0 0 30px #f59e0b) !important;
        }

        .interactive-circle.active text {
            fill: #0f172a !important;
            font-weight: 900 !important;
        }
    </style>
</head>
<body class="p-4">

    <main class="w-full max-w-4xl mx-auto flex justify-center items-center">
        <div class="relative w-full overflow-hidden rounded-2xl border border-slate-700/60 shadow-2xl bg-slate-950/50">
            <svg viewBox="0 0 1000 1000" class="w-full h-auto block">
                <image href="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png" x="0" y="0" width="1000" height="1000" />

                <g class="interactive-circle" onclick="toggleGlow(this)">
                    <circle cx="800" cy="800" r="35" />
                    <text x="800" y="808" text-anchor="middle">ر</text>
                </g>

                <g class="interactive-circle" onclick="toggleGlow(this)">
                    <circle cx="800" cy="200" r="35" />
                    <text x="800" y="208" text-anchor="middle">ت</text>
                </g>

                <g class="interactive-circle" onclick="toggleGlow(this)">
                    <circle cx="200" cy="200" r="35" />
                    <text x="200" y="208" text-anchor="middle">ا</text>
                </g>

                <g class="interactive-circle" onclick="toggleGlow(this)">
                    <circle cx="200" cy="800" r="35" />
                    <text x="200" y="808" text-anchor="middle">ج</text>
                </g>
            </svg>
        </div>
    </main>

    <script>
        // دالة التبديل لتوهج الدوائر باللون الذهبي عند النقر
        function toggleGlow(element) {
            element.classList.toggle('active');
        }
    </script>
</body>
</html>
