<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden; /* إلغاء التمرير نهائياً */
      font-family: "Aref Ruqaa", serif;
    }

    body {
      position: relative;
      /* خلفية الموقع الأصلية */
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* غشاء أسود شفاف لإبراز الكتابات والنصوص */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    .artwork {
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;

      /* صورة أصلية بمنتصف الشاشة */
      transform: translate(-50%, -50%) rotate(5deg);

      pointer-events: none;
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        scale .2s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      scale: 1.05;
    }

    .letter-button[aria-pressed="true"] {
      border-color: var(--gold-bright);
      background: rgba(16, 26, 53, 0.92);
      color: #fff;
      box-shadow:
        0 0 15px 4px rgba(255, 211, 94, .85),
        0 0 34px 12px rgba(255, 194, 54, .62),
        inset 0 0 14px rgba(255, 255, 225, .4);
      animation: golden-glow 1.5s ease-in-out infinite alternate;
    }

    /* التوسع الأفقي لحرفي الراء والتاء عند الضغط عليهما */
    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(260px, 60vw, 340px);
      height: auto;
      min-height: 140px;
      padding: 12px 16px;
      border-radius: 20px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--gold-bright);
      font-size: clamp(14px, 2.2vw, 18px);
      line-height: 1.6;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 8px rgba(255, 214, 107, 0.5);
    }

    /* مؤشر الكيبورد النابض */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 10px 3px rgba(255, 211, 94, .72),
          0 0 25px 8px rgba(255, 194, 54, .42),
          inset 0 0 12px rgba(255, 255, 225, .3);
      }

      to {
        box-shadow:
          0 0 17px 6px rgba(255, 231, 153, .96),
          0 0 40px 16px rgba(255, 194, 54, .68),
          inset 0 0 18px rgba(255, 255, 225, .5);
      }
    }

    /* مواقع الدوائر عند نهايات الأسهم في الصورة */
    .letter-ra {
      left: 82%;
      top: 87%;
    }

    .letter-ta {
      left: 85%;
      top: 16%;
    }

    .letter-alif {
      left: 47%;
      top: 14%;
    }

    .letter-jeem {
      left: 13%;
      top: 88%;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }

      .artwork {
        width: min(82vw, 64vh, 420px);
      }

      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 240px;
        min-height: 120px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main aria-label="مساحة عرض الصورة الحرفية">
    <div class="artwork" aria-label="الصورة التفاعلية وحروفها">
      <img
        class="artwork-image"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
        alt="رسم عربي مزخرف"
        draggable="false"
      >

      <!-- حرف الراء -->
      <button
        class="letter-button letter-ra letter-expandable"
        type="button"
        aria-label="حرف الراء"
        aria-pressed="false"
        title="راء"
        data-letter="ra"
      >
        <span class="letter-text">ر</span>
        <div class="typed-container">
          <p class="typed-text" id="typed-text-ra"></p><span class="cursor" id="cursor-ra" style="display:none;"></span>
        </div>
      </button>

      <!-- حرف التاء -->
      <button
        class="letter-button letter-ta letter-expandable"
        type="button"
        aria-label="حرف التاء"
        aria-pressed="false"
        title="تاء"
        data-letter="ta"
      >
        <span class="letter-text">ت</span>
        <div class="typed-container">
          <p class="typed-text" id="typed-text-ta"></p><span class="cursor" id="cursor-ta" style="display:none;"></span>
        </div>
      </button>

      <!-- حرف الألف -->
      <button
        class="letter-button letter-alif"
        type="button"
        aria-label="حرف الألف"
        aria-pressed="false"
        title="ألف"
      >ا</button>

      <!-- حرف الجيم -->
      <button
        class="letter-button letter-jeem"
        type="button"
        aria-label="حرف الجيم"
        aria-pressed="false"
        title="جيم"
      >ج</button>
    </div>
  </main>

  <!-- الأصوات الخفية التي تعمل عند التوسيع -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <script>
    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 80) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      // إيقاف جميع الأصوات وإعادتها للبداية
      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      // تفريغ أسطر الكتابة وإخفاء المؤشرات
      ['ra', 'ta'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        // إيقاف تأثير الحروف وإعادة الضبط
        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        // تفعيل الحرف المُنقر عليه
        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 80);
          }
        }
      });
    });
  </script>
</body>
</html>
