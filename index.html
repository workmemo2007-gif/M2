<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --circle-size: clamp(42px, 7.2vw, 62px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 214, 107, .55) rgba(8, 11, 22, .5);
    }

    body {
      min-height: 300vh;
      margin: 0;
      overflow-x: hidden;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center 0;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .scroll-space {
      min-height: 300vh;
      width: 100%;
    }

    .artwork {
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: min(88vw, 82vh, 760px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    .connectors {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .connector {
      fill: none;
      stroke: var(--gold);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .92;
      filter: drop-shadow(0 0 5px rgba(255, 214, 107, .62));
      marker-end: url(#gold-arrow);
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid rgba(255, 230, 158, .92);
      border-radius: 50%;
      background: rgba(12, 15, 29, .9);
      color: #fff8dc;
      font: 700 clamp(22px, 3vw, 32px)/1 system-ui, sans-serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 12px rgba(255, 198, 74, .38),
        inset 0 0 10px rgba(255, 214, 107, .12);
      transform: translate(-50%, -50%);
      transition:
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        scale .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: var(--gold-bright);
      color: var(--gold-bright);
      box-shadow:
        0 0 20px rgba(255, 214, 107, .72),
        inset 0 0 12px rgba(255, 214, 107, .2);
      scale: 1.08;
    }

    .letter-button[aria-pressed="true"] {
      border-color: var(--gold-bright);
      background: radial-gradient(
        circle,
        rgba(255, 218, 118, .95),
        rgba(188, 119, 14, .9)
      );
      color: #241600;
      box-shadow:
        0 0 12px 4px rgba(255, 211, 94, .8),
        0 0 34px 12px rgba(255, 194, 54, .56),
        inset 0 0 14px rgba(255, 255, 225, .85);
      animation: golden-glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 10px 3px rgba(255, 211, 94, .72),
          0 0 25px 8px rgba(255, 194, 54, .42),
          inset 0 0 12px rgba(255, 255, 225, .7);
      }

      to {
        box-shadow:
          0 0 17px 6px rgba(255, 231, 153, .96),
          0 0 40px 16px rgba(255, 194, 54, .68),
          inset 0 0 18px rgba(255, 255, 225, .95);
      }
    }

    /* مواقع دوائر الحروف قرب نهايات الأسهم في الصورة */
    .letter-ra {
      left: 81%;
      top: 88%;
    }

    .letter-ta {
      left: 86%;
      top: 14%;
    }

    .letter-alif {
      left: 46%;
      top: 8%;
    }

    .letter-jeem {
      left: 13%;
      top: 88%;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 44px;
      }

      .artwork {
        width: min(94vw, 72vh);
      }

      .connector {
        stroke-width: 5;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scroll-space" aria-label="مساحة للتصفح صعوداً ونزولاً">
    <div class="artwork" aria-label="الصورة التفاعلية والحروف المرتبطة بها">

      <img
        class="artwork-image"
        src="https://raw.githubusercontent.com/workmemo2007-gif/M2/93d760cc9f33a21f2c0867fa02795531fd73a040/IMG_2573.png"
        alt="رسم عربي مزخرف تتصل به أربعة أسهم"
        draggable="false"
      >

      <svg
        class="connectors"
        viewBox="0 0 1000 1000"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <marker
            id="gold-arrow"
            markerWidth="9"
            markerHeight="9"
            refX="7"
            refY="4.5"
            orient="auto"
            markerUnits="strokeWidth"
          >
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffd66b"></path>
          </marker>
        </defs>

        <!-- الراء -->
        <path class="connector" d="M700 710 Q755 770 790 850"></path>

        <!-- التاء -->
        <path class="connector" d="M700 420 Q770 330 830 175"></path>

        <!-- الألف -->
        <path class="connector" d="M540 390 Q495 265 465 110"></path>

        <!-- الجيم -->
        <path class="connector" d="M335 600 Q250 700 160 850"></path>
      </svg>

      <button
        class="letter-button letter-ra"
        type="button"
        aria-label="حرف الراء"
        aria-pressed="false"
        title="راء"
      >ر</button>

      <button
        class="letter-button letter-ta"
        type="button"
        aria-label="حرف التاء"
        aria-pressed="false"
        title="تاء"
      >ت</button>

      <button
        class="letter-button letter-alif"
        type="button"
        aria-label="حرف الألف"
        aria-pressed="false"
        title="ألف"
      >ا</button>

      <button
        class="letter-button letter-jeem"
        type="button"
        aria-label="حرف الجيم"
        aria-pressed="false"
        title="جيم"
      >ج</button>
    </div>
  </main>

  <script>
    // تحريك الخلفية عند الصعود والنزول مع الحفاظ على سلاسة الأداء.
    let framePending = false;

    function updateParallax() {
      const offset = -(window.scrollY * 0.22);
      document.body.style.backgroundPosition = `center ${offset}px`;
      framePending = false;
    }

    window.addEventListener("scroll", () => {
      if (!framePending) {
        window.requestAnimationFrame(updateParallax);
        framePending = true;
      }
    }, { passive: true });

    updateParallax();

    // النقر على أي حرف يشغّل الوهج الذهبي للدائرة.
    document.querySelectorAll(".letter-button").forEach((button) => {
      button.addEventListener("click", () => {
        const isActive = button.getAttribute("aria-pressed") === "true";
        button.setAttribute("aria-pressed", String(!isActive));
      });
    });
  </script>
</body>
</html>
