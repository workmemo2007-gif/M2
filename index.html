<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة و Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --pink-accent: #ff66a3;
      --off-white-glow: rgba(255, 253, 245, 0.95);
      --circle-size: clamp(40px, 5.8vw, 52px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      will-change: background-position;
    }

    /* تم تقليل التأثير الداكن وجعله أكثر شفافية */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.30);
      z-index: 0;
      pointer-events: none;
    }

    .section-container {
      position: relative;
      z-index: 1;
      min-height: auto;
      padding: 220px 0 20px 0; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      position: relative;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;
      transform: rotate(-6deg) translateY(20px); 
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    /* === تصميم الكارت الزجاجي المصغر والمحسن === */
    .glass-card-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      margin: 25px 0;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.08);
      color: #fff;
      direction: rtl;
    }

    /* الشريط العلوي (العنوان وزر الموسيقى) */
    .card-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .card-title {
      font-size: clamp(20px, 4vw, 24px);
      color: var(--gold-bright);
      margin: 0;
      text-shadow: 0 0 10px rgba(255, 214, 107, 0.5);
    }

    /* زر تشغيل الموسيقى العلوي */
    .play-pause-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #080b16;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }

    .play-pause-btn:hover {
      transform: scale(1.08);
      background: #fff;
      box-shadow: 0 3px 12px rgba(255,255,255,0.6);
    }

    .play-pause-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .quotes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quotes-list p {
      margin: 0;
      font-size: clamp(14px, 3.2vw, 16px);
      line-height: 1.6;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    /* تنسيق النص الشفاف والصغير المطلوب للإعادة */
    .sub-quote {
      font-size: clamp(11px, 2.5vw, 13px) !important;
      opacity: 0.65;
      color: rgba(255, 255, 255, 0.85);
      margin-top: -4px !important;
      margin-bottom: 4px !important;
      padding-right: 12px;
    }

    /* شريط الموجات المتذبذبة الأبيض الناصع والمشع بالأسفل */
    .card-audio-waves-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 22px;
      margin-top: 18px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .card-wave-bar {
      flex: 1;
      margin: 0 1.5px;
      height: 100%;
      background-color: #ffffff;
      border-radius: 2px;
      transform-origin: bottom;
      animation: card-wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 15px rgba(255, 255, 255, 0.5);
      opacity: 0.4;
    }

    .card-wave-bar.active {
      opacity: 1;
    }

    .card-wave-bar:nth-child(2n) { animation-delay: 0.12s; }
    .card-wave-bar:nth-child(3n) { animation-delay: 0.25s; }
    .card-wave-bar:nth-child(4n) { animation-delay: 0.38s; }
    .card-wave-bar:nth-child(5n) { animation-delay: 0.18s; }

    @keyframes card-wave-bounce {
      0% { transform: scaleY(0.2); }
      100% { transform: scaleY(1); }
    }
    /* =========================== */

    .second-artwork-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0px 10px 10px 10px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    .second-artwork {
      width: min(95vw, 90vh, 1000px);
      max-width: 100%;
      height: auto;
      border: none;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
      opacity: 0;
      transform: translateY(60px) scale(0.92);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    .second-artwork.slide-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* أزرار الحروف التفاعلية */
    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        transform .4s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .letter-button[aria-pressed="true"] {
      border: 2px solid var(--gold-bright);
      background: rgba(252, 249, 240, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-bright);
      box-shadow:
        0 0 20px 6px rgba(255, 214, 107, 0.45),
        0 0 40px 14px rgba(255, 194, 54, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.25);
      animation: golden-glow 1.8s ease-in-out infinite alternate;
    }

    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(210px, 48vw, 260px);
      height: auto;
      min-height: 100px;
      padding: 10px 14px 14px 14px;
      border-radius: 16px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--off-white-glow);
      font-size: clamp(13px, 1.9vw, 16px);
      line-height: 1.6;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 214, 107, 0.7);
      font-weight: 700;
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 18px;
      margin-top: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 214, 107, 0.35);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1px;
      height: 100%;
      background-color: var(--gold-bright);
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 6px rgba(255, 214, 107, 0.7);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold-bright);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 14px 4px rgba(255, 211, 94, .5),
          0 0 28px 8px rgba(255, 194, 54, .3),
          inset 0 0 14px rgba(255, 255, 255, .2);
      }
      to {
        box-shadow:
          0 0 22px 8px rgba(255, 231, 153, .8),
          0 0 45px 18px rgba(255, 194, 54, .5),
          inset 0 0 22px rgba(255, 255, 255, .35);
      }
    }

    .letter-ra { left: 82%; top: 87%; }
    .letter-ta { left: 85%; top: 16%; }
    .letter-ta[aria-pressed="true"] {
      transform: translate(-100%, -100%);
      transform-origin: bottom right;
    }
    .letter-alif { left: 47%; top: 14%; }
    .letter-jeem { left: 13%; top: 88%; }
    .letter-jeem[aria-pressed="true"] {
      transform: translate(0, 0);
      transform-origin: top left;
    }

    .footer-controls {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 130px 20px 160px 20px;
      width: 100%;
    }

    .bottom-bar {
      display: flex;
      width: 95%;
      max-width: 160px;
      height: 75px; 
      background: #ffffff;
      border-radius: 50px;
      box-shadow: 
        0 0 25px rgba(255, 255, 255, 0.8), 
        0 0 50px rgba(255, 255, 255, 0.5), 
        inset 0 0 20px rgba(255, 255, 255, 1);
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    .heart-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ff66a3, #db2777);
      border: none;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
      user-select: none;
    }

    .heart-btn .btn-icon {
      width: 38px;
      height: 38px;
      fill: currentColor;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: transform 0.2s ease;
    }

    .heart-btn:hover {
      background: linear-gradient(145deg, #db2777, #be185d);
    }

    .heart-btn:hover .btn-icon {
      transform: scale(1.15);
    }

    .heart-btn:active .btn-icon {
      transform: scale(0.9);
    }

    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      user-select: none;
      animation: floatUp 1.8s ease-out forwards;
      filter: drop-shadow(0 2px 6px rgba(236, 72, 153, 0.6));
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: translate(var(--tx), -70px) scale(1.2) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx-end), -160px) scale(0.7) rotate(var(--rot-end));
      }
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }
      .artwork {
        width: min(82vw, 64vh, 420px);
      }
      .glass-card-wrapper {
        padding: 10px;
      }
      .glass-card {
        padding: 16px 14px;
        max-width: 330px;
      }
      .second-artwork {
        width: 100vw;
      }
      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 200px;
        min-height: 85px;
        padding: 8px 10px 10px 10px;
      }
      .bottom-bar {
        height: 65px;
        max-width: 130px;
      }
      .heart-btn .btn-icon {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

            <div class="audio-waves">

            <div class="audio-waves">

          <div class="typed-container">
            <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>
            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- الكارت الزجاجي المصغر والمحسن (تم تحديث النص بالداخل ورابط الصوت الجديد) -->
    <div class="glass-card-wrapper">

        <!-- الشريط العلوي الذي يحمل اسم رتاج وزر تشغيل الموسيقى -->

        <!-- ملف الصوت الجديد المحدث -->
        <audio id="card-audio-element" src="https://raw.githubusercontent.com/workmemo2007-gif/M2/cb5928cdcc51b2d01ad01d75c6ee1c3479a0b22c/telegram-cloud-document-4-5908886701551396122.mp4%202.mp3" preload="metadata"></audio>

        alt="صورة عائمة جديدة"
        draggable="false"
      >
    </div>

    <!-- القسم الثالث: شريط القلب السفلي المتموضع في الأسفل أكثر -->
    <div class="footer-controls">
      <div class="bottom-bar">
        <button type="button" class="heart-btn" id="btn-heart" title="قلب حب">
          <svg viewBox="0 0 24 24" class="btn-icon"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
    </div>

  </main>

  <!-- الأصوات التابعة للحروف -->
  <audio id="audio-ra" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/43ae8c0dcba605028e4de75ff57d79451060c899/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%B1%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-alif" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/72ad2bf2d4691e866f88413a9f1bd6a809c2c125/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%A7%E2%81%A9.mp3" type="audio/mpeg">
  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <script>
    function updateBackgroundOnScroll() {
      const scrollY = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      
      if (maxScroll > 0) {
        const scrollPercent = (scrollY / maxScroll) * 100;
        document.body.style.backgroundPositionY = `${scrollPercent}%`;
      }
    }

    window.addEventListener("scroll", updateBackgroundOnScroll);
    window.addEventListener("resize", updateBackgroundOnScroll);

    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    // عناصر الكارت الصوتي
    const cardAudio = document.getElementById("card-audio-element");
    const cardPlayBtn = document.getElementById("card-play-btn");
    const cardWaves = document.getElementById("card-waves");
    const playIconSVG = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    const pauseIconSVG = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

    function startTyping(text, textElement, cursorElement, speed = 130) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      // إيقاف أصوات الحروف
      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      // إيقاف صوت الكارت الزجاجي إذا كان يعمل لكي لا تتداخل الأصوات
      if (cardAudio) {
        cardAudio.pause();
        cardPlayBtn.innerHTML = playIconSVG;
        if (cardWaves) {
          cardWaves.querySelectorAll('.card-wave-bar').forEach(b => b.classList.remove('active'));
        }
      }

      // مسح نصوص الحروف
      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    // برمجة أزرار الحروف
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 130);
          }
        }
      });
    });

    // === برمجة زر وموجات الصوت داخل الكارت الزجاجي ===
    if (cardPlayBtn && cardAudio) {
      cardPlayBtn.addEventListener("click", () => {
        if (cardAudio.paused) {
          stopAllEffects(); // إيقاف أي أصوات أخرى
          cardAudio.play().catch(() => {});
          cardPlayBtn.innerHTML = pauseIconSVG;
          if (cardWaves) {
            cardWaves.querySelectorAll('.card-wave-bar').forEach(b => b.classList.add('active'));
          }
        } else {
          cardAudio.pause();
          cardPlayBtn.innerHTML = playIconSVG;
          if (cardWaves) {
            cardWaves.querySelectorAll('.card-wave-bar').forEach(b => b.classList.remove('active'));
          }
        }
      });

      cardAudio.addEventListener("ended", () => {
        cardPlayBtn.innerHTML = playIconSVG;
        if (cardWaves) {
          cardWaves.querySelectorAll('.card-wave-bar').forEach(b => b.classList.remove('active'));
        }
      });
    }

    // حركة الصورة الثانية
    const secondImg = document.getElementById("second-img");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          secondImg.classList.add("slide-in");
        }
      });
    }, { threshold: 0.15 });
    observer.observe(secondImg);

    // برمجة زر القلب
    const btnHeart = document.getElementById("btn-heart");
    if (btnHeart) {
      btnHeart.addEventListener("click", (e) => {
        const rect = btnHeart.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const heartCount = 14;
        for (let i = 0; i < heartCount; i++) {
          setTimeout(() => {
            createFloatingHeart(centerX, centerY);
          }, i * 50);
        }
      });
    }

    function createFloatingHeart(x, y) {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      
      const heartIcons = ["🩷", "🌸", "💕", "💗"];
      heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];

      const tx = (Math.random() - 0.5) * 90;
      const txEnd = tx + (Math.random() - 0.5) * 70;
      const rot = (Math.random() - 0.5) * 50;
      const rotEnd = (Math.random() - 0.5) * 90;
      const size = Math.floor(Math.random() * 14) + 16;

      heart.style.left = `${x - size / 2}px`;
      heart.style.top = `${y - size / 2}px`;
      heart.style.fontSize = `${size}px`;
      heart.style.setProperty("--tx", `${tx}px`);
      heart.style.setProperty("--tx-end", `${txEnd}px`);
      heart.style.setProperty("--rot", `${rot}deg`);
      heart.style.setProperty("--rot-end", `${rotEnd}deg`);

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 1800);
    }
  </script>
</body>
</html>
