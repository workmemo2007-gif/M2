<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>الصورة التفاعلية</title>

  <!-- خط الرقعة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      color-scheme: dark;
      --gold: #ffd66b;
      --gold-bright: #fff1b8;
      --gold-dark-bg: rgba(30, 22, 10, 0.92);
      --off-white-translucent: rgba(250, 248, 242, 0.18);
      --off-white-glow: rgba(255, 253, 245, 0.95);
      --gold-border: rgba(255, 214, 107, 0.85);
      --circle-size: clamp(40px, 5.8vw, 52px);
      --red-love: #ff2a5f;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Aref Ruqaa", serif;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      background-color: #080b16;
      background-image: url("https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      will-change: background-position;
    }

    /* غشاء أسود شفاف لإبراز الكتابات والنصوص */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    /* 1. شريط التقدم بشكل خيط الحب الأحمر */
    .love-thread-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 12px;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .love-thread-line {
      height: 4px;
      background: linear-gradient(90deg, #ff2a5f, #ff758c, #ff2a5f);
      width: 0%;
      box-shadow: 0 0 10px #ff2a5f, 0 0 18px rgba(255, 42, 95, 0.8);
      transition: width 0.1s linear;
      border-radius: 0 4px 4px 0;
      position: relative;
    }

    .love-thread-heart {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--red-love);
      font-size: 16px;
      text-shadow: 0 0 8px #ff2a5f;
    }

    .section-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork {
      position: relative;
      width: min(72vw, 68vh, 560px);
      aspect-ratio: 1;
      transform: rotate(5deg);
      isolation: isolate;
    }

    .artwork-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 22px rgba(28, 69, 255, .2));
    }

    /* 2. تصميم بطاقة الكشط السهلة Scratch Card */
    .second-artwork-container {
      position: relative;
      z-index: 1;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px 60px 10px;
      box-sizing: border-box;
    }

    .scratch-card-wrapper {
      position: relative;
      width: min(98vw, 95vh, 1100px);
      max-width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transform: translateY(120px) scale(0.92);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .scratch-card-wrapper.slide-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .second-artwork {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    .scratch-hint {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--gold-bright);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
      z-index: 2;
      border: 1px solid var(--gold-border);
      backdrop-filter: blur(5px);
    }

    /* 3. دفتر/ألبوم الصور الكلاسيكي (Flipbook) */
    .flipbook-section {
      position: relative;
      z-index: 1;
      padding: 60px 15px 100px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flipbook-title {
      color: var(--gold-bright);
      font-size: clamp(22px, 4vw, 32px);
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(255, 214, 107, 0.5);
    }

    .flipbook-container {
      position: relative;
      width: min(90vw, 550px);
      height: min(120vw, 680px);
      perspective: 1500px;
    }

    .flipbook-page {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 12px;
      background: #151b2e;
      border: 2px solid var(--gold-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transform-origin: right center;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      backface-visibility: hidden;
      user-select: none;
    }

    .flipbook-page.flipped {
      transform: rotateY(-180deg);
    }

    .flipbook-img-container {
      width: 100%;
      height: 75%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .flipbook-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flipbook-caption {
      color: var(--off-white-glow);
      font-size: clamp(15px, 2.2vw, 18px);
      text-align: center;
      margin-top: 10px;
    }

    .flipbook-controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .flipbook-btn {
      background: rgba(255, 214, 107, 0.15);
      border: 1px solid var(--gold-border);
      color: var(--gold-bright);
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .flipbook-btn:hover {
      background: var(--gold);
      color: #080b16;
    }

    .letter-button {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--circle-size);
      height: var(--circle-size);
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #fff;
      color: #101a35;
      font: 700 clamp(22px, 3vw, 32px)/1 "Aref Ruqaa", serif;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 0 13px 3px rgba(48, 126, 255, .78),
        0 0 30px 8px rgba(34, 94, 255, .38),
        inset 0 0 9px rgba(255, 255, 255, .95);
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transition:
        width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.4s ease,
        color .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .25s ease,
        transform .4s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .letter-button:hover,
    .letter-button:focus-visible {
      outline: none;
      border-color: #dbeaff;
      box-shadow:
        0 0 20px 5px rgba(67, 145, 255, .95),
        0 0 38px 12px rgba(34, 94, 255, .52),
        inset 0 0 10px rgba(255, 255, 255, .98);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .letter-button[aria-pressed="true"] {
      border: 2px solid var(--gold-bright);
      background: rgba(252, 249, 240, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-bright);
      box-shadow:
        0 0 20px 6px rgba(255, 214, 107, 0.45),
        0 0 40px 14px rgba(255, 194, 54, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.25);
      animation: golden-glow 1.8s ease-in-out infinite alternate;
    }

    .letter-button.letter-expandable[aria-pressed="true"] {
      width: clamp(210px, 48vw, 260px);
      height: auto;
      min-height: 100px;
      padding: 10px 14px 14px 14px;
      border-radius: 16px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .letter-text {
      display: none;
    }

    .typed-container {
      display: none;
      width: 100%;
      text-align: right;
      direction: rtl;
    }

    .letter-button.letter-expandable[aria-pressed="true"] .typed-container {
      display: block;
    }

    .typed-text {
      color: var(--off-white-glow);
      font-size: clamp(13px, 1.9vw, 16px);
      line-height: 1.6;
      white-space: pre-line;
      margin: 0;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 214, 107, 0.7);
      font-weight: 700;
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 18px;
      margin-top: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 214, 107, 0.35);
    }

    .audio-wave-bar {
      flex: 1;
      margin: 0 1px;
      height: 100%;
      background-color: var(--gold-bright);
      border-radius: 2px;
      transform-origin: bottom;
      animation: wave-bounce 0.8s ease-in-out infinite alternate;
      box-shadow: 0 0 6px rgba(255, 214, 107, 0.7);
    }

    .audio-wave-bar:nth-child(2n) { animation-delay: 0.15s; }
    .audio-wave-bar:nth-child(3n) { animation-delay: 0.3s; }
    .audio-wave-bar:nth-child(4n) { animation-delay: 0.45s; }
    .audio-wave-bar:nth-child(5n) { animation-delay: 0.2s; }

    @keyframes wave-bounce {
      0% { transform: scaleY(0.15); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: var(--gold-bright);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes golden-glow {
      from {
        box-shadow:
          0 0 14px 4px rgba(255, 211, 94, .5),
          0 0 28px 8px rgba(255, 194, 54, .3),
          inset 0 0 14px rgba(255, 255, 255, .2);
      }
      to {
        box-shadow:
          0 0 22px 8px rgba(255, 231, 153, .8),
          0 0 45px 18px rgba(255, 194, 54, .5),
          inset 0 0 22px rgba(255, 255, 255, .35);
      }
    }

    .letter-ra { left: 82%; top: 87%; }
    
    .letter-ta { left: 85%; top: 16%; }
    .letter-ta[aria-pressed="true"] {
      transform: translate(-100%, -100%);
      transform-origin: bottom right;
    }

    .letter-alif { left: 47%; top: 14%; }

    .letter-jeem { left: 13%; top: 88%; }
    .letter-jeem[aria-pressed="true"] {
      transform: translate(0, 0);
      transform-origin: top left;
    }

    @media (max-width: 520px) {
      :root {
        --circle-size: 42px;
      }
      .artwork {
        width: min(82vw, 64vh, 420px);
      }
      .letter-button.letter-expandable[aria-pressed="true"] {
        width: 200px;
        min-height: 85px;
        padding: 8px 10px 10px 10px;
      }
    }
  </style>
</head>

<body>

  <!-- شريط تقدم خيط الحب -->
  <div class="love-thread-container">
    <div style="color: var(--red-love); font-size: 14px; margin-right: 5px;">❤️</div>
    <div class="love-thread-line" id="loveThread"></div>
  </div>

  <main aria-label="مساحة عرض الصورة الحرفية">
    
    <div class="section-container">

              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>

        <!-- حرف التاء -->

          <div class="typed-container">

            <div class="audio-waves">
              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>

        <!-- حرف الألف -->

              <div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div><div class="audio-wave-bar"></div>
            </div>
          </div>
        </button>

        <!-- حرف الجيم -->
        <button
          class="letter-button letter-jeem letter-expandable"
          type="button"
          aria-label="حرف الجيم"
          aria-pressed="false"
          title="جيم"
          data-letter="jeem"
        >
          <span class="letter-text">ج</span>
          <div class="typed-container">
            <p class="typed-text" id="typed-text-jeem"></p><span class="cursor" id="cursor-jeem" style="display:none;"></span>

    <!-- القسم الثاني: بطاقة الكشط Scratch Card -->

    <!-- القسم الثالث: ألبوم الذكريات التفاعلي Flipbook -->

  <!-- الأصوات -->

  </audio>

  <audio id="audio-ta" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/J/3170a08c4916f27102b32cdacaca86335bb27383/%E2%80%8E%E2%81%A8%D8%AD%D8%B1%D9%81%20%D8%AA%E2%81%A9.mp3" type="audio/mpeg">

  <audio id="audio-alif" preload="metadata">

  </audio>

  <audio id="audio-jeem" preload="metadata">
    <source src="https://raw.githubusercontent.com/workmemo2007-gif/M2/8da0fced89cbc566d6cffe25fce5347ab6e10d22/telegram-cloud-document-2-5321499372058354999.mp4.mp3" type="audio/mpeg">
  </audio>

  <script>
    // 1. تحديث شريط التقدم بخيط الحب وحركة الخلفية مع التمرير
    function updateOnScroll() {
      const scrollY = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      
      if (maxScroll > 0) {
        const scrollPercent = (scrollY / maxScroll) * 100;
        document.body.style.backgroundPositionY = `${scrollPercent}%`;
        
        // شريط خيط الحب
        const thread = document.getElementById("loveThread");
        if (thread) {
          thread.style.width = `${scrollPercent}%`;
        }
      }
    }

    window.addEventListener("scroll", updateOnScroll);
    window.addEventListener("resize", updateOnScroll);

    // 2. منطق بطاقة الكشط (Scratch Card Logic)
    const canvas = document.getElementById("scratchCanvas");
    const ctx = canvas.getContext("2d");
    const imgContainer = document.getElementById("scratch-wrapper");
    let isDrawing = false;

    function initScratchCard() {
      canvas.width = imgContainer.clientWidth;
      canvas.height = imgContainer.clientHeight;

      // إنشاء خلفية الطبقة التي سيتم كشطها (ذهبية فاخرة مع نقش ناعم)
      ctx.fillStyle = "#2a1f10";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffd66b";
      ctx.font = "20px 'Aref Ruqaa', serif";
      ctx.textAlign = "center";
      ctx.fillText("✨ امسح هنا لتكشف الصورة ✨", canvas.width / 2, canvas.height / 2);
    }

    function scratch(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;

      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x, y, 35, 0, Math.PI * 2); // نصف قطر واسع للكشط السريع والسهل
      ctx.fill();
    }

    canvas.addEventListener("mousedown", (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener("mousemove", scratch);
    window.addEventListener("mouseup", () => isDrawing = false);

    canvas.addEventListener("touchstart", (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener("touchmove", scratch);
    window.addEventListener("touchend", () => isDrawing = false);

    window.addEventListener("load", initScratchCard);
    window.addEventListener("resize", initScratchCard);

    // 3. ألبوم الصفحات (Flipbook Logic)
    const pages = document.querySelectorAll(".flipbook-page");
    let currentPage = pages.length - 1;

    function nextPage() {
      if (currentPage >= 0) {
        pages[currentPage].classList.add("flipped");
        currentPage--;
      }
    }

    function prevPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        pages[currentPage].classList.remove("flipped");
      }
    }

    // منطق الحروف والصوتيات الأساسي
    const buttons = document.querySelectorAll(".letter-button");

    const audioMap = {
      ra: document.getElementById("audio-ra"),
      ta: document.getElementById("audio-ta"),
      alif: document.getElementById("audio-alif"),
      jeem: document.getElementById("audio-jeem")
    };

    const textMap = {
      ra: `رسمتك بالخيال والله جابك
وصلت لمرحلة أرتاح بعذابك
هو العنده مثلك يزعل شبيك
ومنو غيرك يسوى بقلبي أخليه
منو يزعل بشر يسوى لـ مية
يلوموني وقلبهم مو عليك`,

      ta: `تعرف غلاتك لو بعد؟
محتاج أبينها أكثر؟
يل بيك لهاني العمر.. ما ركزت بيه من مر
يمكن إذا قتلي شكثر تهواني راح أتحير
الليلة أعد محبتك.. بس باجر تزود أكثر`,

      alif: `أنتِ.. أنتِ روحي
أنتِ روحي وراحتي
وآخر ندى على الورد ينزل
أنتِ ليلي ولادتي ودفاي
اللي جمع حلاوة الشمس والظل`,

      jeem: `جمالك جمال.. جمالك جمال مو عادي
كلامك كلام.. كلامك كلام مو عادي
شو بدك دلال.. على صوت الدلال غفيلي
شو بدك غرام.. ليل الغرام هنيلي`
    };

    let typingTimeout;

    function startTyping(text, textElement, cursorElement, speed = 130) {
      textElement.textContent = "";
      cursorElement.style.display = "inline-block";
      let index = 0;

      function type() {
        if (index < text.length) {
          textElement.textContent += text.charAt(index);
          index++;
          typingTimeout = setTimeout(type, speed);
        }
      }
      type();
    }

    function stopAllEffects() {
      clearTimeout(typingTimeout);

      Object.values(audioMap).forEach(audio => {
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      ['ra', 'ta', 'alif', 'jeem'].forEach(key => {
        const txt = document.getElementById(`typed-text-${key}`);
        const cur = document.getElementById(`cursor-${key}`);
        if (txt) txt.textContent = "";
        if (cur) cur.style.display = "none";
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const isCurrentlyActive = button.getAttribute("aria-pressed") === "true";
        const letterKey = button.getAttribute("data-letter");

        buttons.forEach((btn) => btn.setAttribute("aria-pressed", "false"));
        stopAllEffects();

        if (!isCurrentlyActive) {
          button.setAttribute("aria-pressed", "true");

          if (letterKey && textMap[letterKey]) {
            const audioObj = audioMap[letterKey];
            if (audioObj) {
              audioObj.play().catch(() => {});
            }

            const textEl = document.getElementById(`typed-text-${letterKey}`);
            const cursorEl = document.getElementById(`cursor-${letterKey}`);
            startTyping(textMap[letterKey], textEl, cursorEl, 130);
          }
        }
      });
    });

    // انيميشن ظهور بطاقة الكشط
    const scratchWrapper = document.getElementById("scratch-wrapper");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          scratchWrapper.classList.add("slide-in");
        }
      });
    }, { threshold: 0.15 });

    observer.observe(scratchWrapper);
  </script>
</body>
</html>
