<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخطوطة رتاج التفاعلية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0d1117;
            background-image: url('https://raw.githubusercontent.com/workmemo2007-gif/R1/c4c2ac757d6fb303ea96a912e78dc58c420103f4/IMG_2572.png');
            background-size: cover;
            background-position: center 0px;
            background-repeat: no-repeat;
            background-attachment: fixed;
            will-change: background-position;
        }

        /* أنماط النص والتوهج الأساسية */
        .letter-group {
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .main-letter {
            fill: #ffffff;
            filter: drop-shadow(0px 0px 8px #3b82f6) drop-shadow(0px 0px 18px #1d4ed8);
            transition: all 0.3s ease;
        }

        .connector-line {
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 1.5;
            stroke-dasharray: 4 2;
            transition: all 0.3s ease;
        }

        .circle-node {
            fill: rgba(13, 17, 23, 0.85);
            stroke: #3b82f6;
            stroke-width: 2;
            filter: drop-shadow(0px 0px 6px #3b82f6);
            transition: all 0.3s ease;
        }

        .circle-text {
            fill: #ffffff;
            font-weight: bold;
            font-size: 18px;
            text-anchor: middle;
            dominant-baseline: central;
            transition: all 0.3s ease;
        }

        /* تأثير التوهج الذهبي عند التحديد */
        .letter-group.active .main-letter {
            fill: #ffd700;
            filter: drop-shadow(0px 0px 12px #ffd700) drop-shadow(0px 0px 25px #ffaa00);
        }

        .letter-group.active .connector-line {
            stroke: #ffd700;
            stroke-width: 2.5;
            stroke-dasharray: none;
            filter: drop-shadow(0px 0px 6px #ffd700);
        }

        .letter-group.active .circle-node {
            stroke: #ffd700;
            fill: rgba(255, 215, 0, 0.15);
            filter: drop-shadow(0px 0px 10px #ffd700);
        }

        .letter-group.active .circle-text {
            fill: #ffd700;
        }

        .letter-group:hover .main-letter {
            filter: drop-shadow(0px 0px 12px #60a5fa) drop-shadow(0px 0px 22px #2563eb);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center justify-center">

    <main class="w-full max-w-5xl px-4 py-12 flex flex-col items-center justify-center min-h-screen">
        
        <div class="w-full max-w-3xl aspect-[16/9] flex items-center justify-center">
            <svg viewBox="0 0 900 450" class="w-full h-full overflow-visible">
                
                <g class="letter-group" onclick="selectLetter(this)">
                    <line x1="680" y1="210" x2="770" y2="100" class="connector-line" />
                    <circle cx="770" cy="100" r="24" class="circle-node" />
                    <text x="770" y="100" class="circle-text">ر</text>
                    <path d="M 660 200 C 670 205, 680 215, 675 235 C 665 270, 630 300, 600 310 C 590 313, 585 305, 595 298 C 620 280, 645 255, 650 220 Z" class="main-letter" />
                </g>

                <g class="letter-group" onclick="selectLetter(this)">
                    <line x1="530" y1="200" x2="550" y2="70" class="connector-line" />
                    <circle cx="550" cy="70" r="24" class="circle-node" />
                    <text x="550" y="70" class="circle-text">ت</text>
                    <circle cx="520" cy="165" r="5" class="main-letter" />
                    <circle cx="538" cy="165" r="5" class="main-letter" />
                    <path d="M 580 205 L 580 215 C 580 230, 560 230, 480 230 L 470 205 L 485 205 C 530 205, 560 205, 565 205 Z" class="main-letter" />
                </g>

                <g class="letter-group" onclick="selectLetter(this)">
                    <line x1="435" y1="120" x2="380" y2="50" class="connector-line" />
                    <circle cx="380" cy="50" r="24" class="circle-node" />
                    <text x="380" y="50" class="circle-text">ا</text>
                    <path d="M 430 230 L 430 110 C 430 100, 442 100, 442 110 L 442 230 Z" class="main-letter" />
                </g>

                <g class="letter-group" onclick="selectLetter(this)">
                    <line x1="300" y1="210" x2="160" y2="120" class="connector-line" />
                    <circle cx="160" cy="120" r="24" class="circle-node" />
                    <text x="160" y="120" class="circle-text">ج</text>
                    <circle cx="270" cy="285" r="6" class="main-letter" />
                    <path d="M 410 230 L 320 230 C 280 230, 240 250, 240 280 C 240 320, 290 330, 330 310 C 345 302, 350 312, 338 322 C 280 350, 215 325, 215 270 C 215 225, 260 205, 310 205 L 360 205 C 375 190, 390 190, 370 205 Z" class="main-letter" />
                </g>

            </svg>
        </div>

    </main>

    <script>
        // دالة التفاعل عند النقر على الحرف أو الدائرة المربوطة به
        function selectLetter(element) {
            // إلغاء التحديد عن جميع الحروف الأخرى
            const allGroups = document.querySelectorAll('.letter-group');
            allGroups.forEach(group => {
                if (group !== element) {
                    group.classList.remove('active');
                }
            });

            // تبديل حالة التحديد للحرف المنقور عليه
            element.classList.toggle('active');
        }

        // إعداد حركة البارالاكس للخلفية عند التصفح
        let ticking = false;
        function updateParallax() {
            const scrollPosition = window.pageYOffset;
            const bgOffset = -(scrollPosition * 0.25);
            document.body.style.backgroundPositionY = bgOffset + 'px';
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateParallax);
                ticking = true;
            }
        });

        window.addEventListener('DOMContentLoaded', updateParallax);
    </script>
</body>
</html>
